name: Apply shared TODAY auth modal

on:
  push:
    paths:
      - 'js/today-auth-bridge.js'
      - '.github/workflows/apply-today-auth-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inject TODAY shared auth bridge
        shell: python
        run: |
          from pathlib import Path
          p=Path('today.html')
          text=p.read_text(encoding='utf-8')
          tag='<script src="js/today-auth-bridge.js"></script>'
          if tag not in text:
              marker='</body>'
              if marker not in text:
                  raise SystemExit('today.html closing body tag not found')
              text=text.replace(marker, '    '+tag+'\n'+marker, 1)
              p.write_text(text, encoding='utf-8')
          else:
              print('TODAY auth bridge already installed')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add today.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Use shared auth modal on TODAY [skip ci]'
          git push origin HEAD:main
