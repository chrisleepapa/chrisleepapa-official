name: Load music production records
on:
  push:
    branches: [develop]
    paths:
      - 'js/music-production-notes.js'
      - 'js/music-production-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add loader to music page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('music.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="js/music-production-notes.js"></script>'
          if tag not in s:
              s=s.replace('<script src="js/main.js"></script>', tag+'\n<script src="js/main.js"></script>')
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add music.html
          git diff --cached --quiet || git commit -m 'Load work-by-work music production records'
          git push
