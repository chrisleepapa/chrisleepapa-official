<!--
  components/footer.html
  ======================
  공유 푸터 컴포넌트입니다.
  js/main.js 의 loadComponents() 가 fetch 로 읽어 #site-footer 에 주입합니다.
-->

<style>
/* =========================================================
   GLOBAL FOOTER — Chris LEE.PAPA Official Site
   모든 페이지 / PC + Mobile 공통
   ========================================================= */
#site-footer{position:relative;z-index:20;width:100%;margin-top:auto}
#site-footer footer{width:100%;margin:0;padding:44px 24px 40px;text-align:center;background:linear-gradient(180deg,rgba(3,3,5,0) 0%,rgba(3,3,5,.72) 34%,rgba(3,3,5,.96) 100%);border-top:1px solid rgba(201,168,76,.12);font-family:'Noto Sans KR','Pretendard',sans-serif;color:rgba(224,224,224,.42);line-height:1.7;letter-spacing:.02em;-webkit-font-smoothing:antialiased}
#site-footer footer p{margin:0}
#site-footer footer p:first-child{font-family:'Cormorant Garamond','Noto Sans KR',serif;font-size:.82rem;letter-spacing:.08em;color:rgba(224,224,224,.48)}
#site-footer .footer-policy{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:12px;font-family:'Noto Sans KR','Pretendard',sans-serif;font-size:.67rem;line-height:1.6;letter-spacing:.04em}
#site-footer .footer-policy a{color:rgba(232,208,138,.58);transition:color .25s ease,text-shadow .25s ease}
#site-footer .footer-policy a:hover,#site-footer .footer-policy a:focus-visible{color:#e8d08a;text-shadow:0 0 12px rgba(201,168,76,.2)}
#site-footer .footer-divider{color:rgba(201,168,76,.28);font-size:.6rem}
#site-footer .movie-creation-cta{max-width:960px;margin:0 auto 38px;padding:28px 30px;text-align:center;border:1px solid rgba(201,168,76,.2);border-radius:18px;background:linear-gradient(135deg,rgba(201,168,76,.07),rgba(255,255,255,.015));box-shadow:0 12px 35px rgba(0,0,0,.28)}
#site-footer .movie-creation-cta p{margin:0 0 16px;color:#a0a0b5;font-size:.82rem;line-height:1.8;word-break:keep-all}
#site-footer .movie-creation-cta strong{display:block;margin-bottom:5px;color:#e8d08a;font-family:'Cinzel',serif;font-size:.9rem;letter-spacing:.12em}
#site-footer .movie-creation-cta a{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border:1px solid rgba(232,208,138,.42);border-radius:10px;color:#e8d08a;font-family:'Noto Sans KR','Pretendard',sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-decoration:none;transition:all .25s ease}
#site-footer .movie-creation-cta a:hover,#site-footer .movie-creation-cta a:focus-visible{border-color:#e8d08a;background:rgba(201,168,76,.1);color:#fff;transform:translateY(-1px)}
#site-footer .furious-creation-note{max-width:1100px;margin:0 auto 42px;padding:34px 40px;text-align:left;border:1px solid rgba(201,168,76,.18);border-radius:20px;background:linear-gradient(135deg,rgba(201,168,76,.055),rgba(255,255,255,.012));box-shadow:0 14px 38px rgba(0,0,0,.25)}
#site-footer .furious-creation-note h3{margin:0 0 10px;color:#e8d08a;font-family:'Cinzel',serif;font-size:1rem;letter-spacing:.12em}
#site-footer .furious-creation-note .note-lead{margin:0 0 24px;color:#c8c4bc;font-size:.95rem;line-height:1.9;word-break:keep-all}
#site-footer .furious-creation-note .note-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
#site-footer .furious-creation-note .note-card{padding:20px;border-radius:14px;background:rgba(255,255,255,.025);border:1px solid rgba(255,255,255,.06)}
#site-footer .furious-creation-note .note-card strong{display:block;margin-bottom:8px;color:#e8d08a;font-size:.78rem;letter-spacing:.08em}
#site-footer .furious-creation-note .note-card p{color:#9999aa;font-size:.82rem;line-height:1.8;word-break:keep-all}
#site-footer .furious-creation-note .note-prompt{margin-top:18px;padding:20px;border-left:2px solid rgba(201,168,76,.55);background:rgba(0,0,0,.16)}
#site-footer .furious-creation-note .note-prompt strong{display:block;margin-bottom:8px;color:#c9a84c;font-size:.76rem;letter-spacing:.08em}
#site-footer .furious-creation-note .note-prompt p{margin:0;color:#aaa9b4;font-size:.82rem;line-height:1.8;word-break:keep-all}
@media(max-width:760px){
  #site-footer footer{padding:30px 18px calc(28px + env(safe-area-inset-bottom));border-top-color:rgba(201,168,76,.14)}
  #site-footer footer p:first-child{font-size:.7rem;letter-spacing:.045em;line-height:1.6}
  #site-footer .footer-policy{margin-top:9px;gap:10px;font-size:.62rem;line-height:1.6}
  #site-footer .movie-creation-cta{margin:0 18px 28px;padding:24px 18px}
  #site-footer .movie-creation-cta p{font-size:.74rem}
  #site-footer .movie-creation-cta a{font-size:.64rem;padding:10px 16px}
  #site-footer .furious-creation-note{margin:0 18px 30px;padding:25px 20px}
  #site-footer .furious-creation-note .note-grid{grid-template-columns:1fr;gap:12px}
  #site-footer .furious-creation-note .note-card{padding:17px}
}
</style>

<footer>
    <div class="movie-creation-cta" id="movieCreationCta" style="display:none">
        <strong>✦ MOVIE CREATION NOTES</strong>
        <p>영상의 아이디어부터 생성형 AI 활용, 제작 과정과 프롬프트까지 자세한 창작 기록을 확인해보세요.</p>
        <a href="/movie-creation" aria-label="Movie Creation Notes — 영상 제작 과정과 제작 프롬프트">제작 과정 &amp; 프롬프트 보기 →</a>
    </div>
    <p data-i18n="footer_text">© 2026 Chris LEE.PAPA — The Creative Archive</p>
    <p class="footer-policy">
        <a href="/privacy" data-i18n="footer_privacy">개인정보처리방침</a>
        <span class="footer-divider">·</span>
        <a href="/terms" data-i18n="footer_terms">이용약관</a>
    </p>
</footer>

<script>
(function(){
  var isMovie = /^\/movie\/?$/i.test(window.location.pathname);
  var cta = document.getElementById('movieCreationCta');
  if(cta && isMovie) cta.style.display='block';
  if(!isMovie) return;

  function addFuriousNote(){
    if(document.getElementById('furiousCreationNote')) return;
    var target=document.querySelector('.screen-info');
    if(!target || !target.parentNode) return;

    var section=document.createElement('section');
    section.className='furious-creation-note';
    section.id='furiousCreationNote';
    section.setAttribute('aria-label','FURIOUS creation notes');
    section.innerHTML=`
      <h3 class="i18n-ko">✦ FURIOUS — 창작 기록</h3>
      <h3 class="i18n-en">✦ FURIOUS — CREATION NOTES</h3>
      <p class="note-lead i18n-ko">이 작품은 단순히 AI로 화려한 영상을 만드는 데서 출발하지 않았습니다. 전쟁과 갈등이 반복되는 현실을 바라보며 느낀 분노와 안타까움을 음악의 감정선에 담고, 그 감정을 시각적인 장면으로 확장하는 방식으로 뮤직비디오를 구성했습니다.</p>
      <p class="note-lead i18n-en">This project did not begin with the goal of making flashy AI visuals. It began with anger and sorrow toward a world shaped by repeated war and conflict. I first carried those emotions into the music, then expanded them into visual scenes to build the music video.</p>
      <div class="note-grid">
        <div class="note-card"><strong class="i18n-ko">01 · 아이디어</strong><strong class="i18n-en">01 · IDEA</strong><p class="i18n-ko">뉴스와 현실에서 마주하는 전쟁과 충돌의 이미지에서 출발했습니다. 폭력을 과장하기보다 사람들이 삶의 터전과 일상을 잃는 무게를 전달하는 것이 핵심이었습니다.</p><p class="i18n-en">The starting point was the reality of war and conflict seen in the world around us. Rather than glorifying violence, the focus was on conveying the human weight of people losing their homes, safety, and ordinary lives.</p></div>
        <div class="note-card"><strong class="i18n-ko">02 · 제작 방법</strong><strong class="i18n-en">02 · PRODUCTION</strong><p class="i18n-ko">먼저 음악의 분위기와 핵심 감정을 정리한 뒤, 장면별 이미지를 생성형 AI로 제작했습니다. 이후 장면을 연결하고 음악의 흐름과 리듬에 맞춰 편집하면서 하나의 뮤직비디오로 완성했습니다.</p><p class="i18n-en">After defining the mood and emotional core of the music, visual materials were generated scene by scene with generative AI. The scenes were then connected and edited to follow the flow and rhythm of the music.</p></div>
        <div class="note-card"><strong class="i18n-ko">03 · AI를 사용한 이유</strong><strong class="i18n-en">03 · WHY AI</strong><p class="i18n-ko">현실에서 촬영하기 어려운 규모와 분위기의 장면을 빠르게 시각화하고, 음악에서 느껴지는 감정을 하나의 영화적 세계로 확장하기 위해 생성형 AI를 활용했습니다.</p><p class="i18n-en">Generative AI made it possible to visualize environments and moods that would be difficult to film conventionally, allowing the emotion of the music to expand into a cinematic visual world.</p></div>
      </div>
      <div class="note-prompt"><strong class="i18n-ko">제작 프롬프트의 방향</strong><strong class="i18n-en">PROMPT DIRECTION</strong><p class="i18n-ko">폐허가 된 현대적 환경, 연기와 파괴의 흔적, 긴장감과 슬픔이 공존하는 분위기, 사실적인 질감과 영화적 조명, 깊이감 있는 구도 등을 중심으로 장면을 설계했습니다. 중요한 기준은 전쟁 자체를 보여주는 것보다 그 결과가 남긴 감정적 무게를 전달하는 것이었습니다.</p><p class="i18n-en">The prompts focused on devastated modern environments, smoke and traces of destruction, tension and sorrow, realistic textures, cinematic lighting, and strong composition. The key principle was to communicate the emotional weight left by conflict rather than simply depicting war itself.</p></div>
    `;
    target.parentNode.insertBefore(section,target.nextSibling);
  }

  function refreshNoteLang(){
    var note=document.getElementById('furiousCreationNote');
    if(!note) return;
    var lang=(typeof window.getCurrentLang==='function') ? window.getCurrentLang() : (localStorage.getItem('pref-lang') || 'ko');
    note.querySelectorAll('.i18n-ko').forEach(function(el){el.style.display=lang==='ko'?'':'none';});
    note.querySelectorAll('.i18n-en').forEach(function(el){el.style.display=lang==='en'?'':'none';});
  }

  addFuriousNote();
  refreshNoteLang();

  var previous=window.onLangChange;
  window.onLangChange=function(lang){
    if(typeof previous==='function') previous(lang);
    refreshNoteLang();
  };
})();
</script>
