name: Daily Chris's News Refresh

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'automation/generate-chris-news.mjs'
      - '.github/workflows/daily-chris-news.yml'
  schedule:
    # 06:00 KST daily = 21:00 UTC on the previous day
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-chris-news-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Set up Python for offline translation
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Argos Translate
        run: python -m pip install argostranslate
      - name: Cache English-Korean translation model
        id: argos-model-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-en-ko-v1-${{ runner.os }}
      - name: Install English-Korean translation model
        if: steps.argos-model-cache.outputs.cache-hit != 'true'
        run: |
          python - <<'PY'
          import argostranslate.package
          argostranslate.package.update_package_index()
          packages = argostranslate.package.get_available_packages()
          package = next((item for item in packages if item.from_code == "en" and item.to_code == "ko"), None)
          if package is None:
              raise SystemExit("Argos Translate English-to-Korean model is unavailable.")
          argostranslate.package.install_from_path(package.download())
          print("Installed offline English-to-Korean translation model.")
          PY
      - name: Check news generator syntax
        run: node --check automation/generate-chris-news.mjs
      - name: Fetch and compile six daily news cards
        run: node automation/generate-chris-news.mjs
      - name: Commit updated news data to selected branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/chris-news.json
          if git diff --cached --quiet; then
            echo "News data is unchanged; nothing to commit."
          else
            git commit -m "Refresh Chris's News for $(date -u +%F)"
            git push origin HEAD:${{ github.ref_name }}
          fi
