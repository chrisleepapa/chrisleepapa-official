name: Apply archive content update

on:
  push:
    branches: [develop]
    paths:
      - 'scripts/apply-archive-content-update.py'
      - '.github/workflows/apply-archive-content-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, 'Apply archive content update') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply content migration
        run: python scripts/apply-archive-content-update.py

      - name: Validate required content
        run: |
          grep -q "Run it back" music.html
          grep -q "나의 찬양 Vol. 3" worship.html
          grep -q "My hymn3.jpg" worship.html
          grep -q "title:'Shout'" js/home-chris-pick-v2.js
          grep -q "title:'나의 찬양 Vol.3'" js/home-chris-pick-v2.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music.html worship.html js/home-chris-pick-v2.js
          git diff --cached --quiet && exit 0
          git commit -m "Apply archive content update"
          git push origin develop
