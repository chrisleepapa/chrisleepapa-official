name: Fix Chris's Pick eligibility

on:
  push:
    paths:
      - '.github/workflows/fix-chris-pick-eligibility.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Fix eligibility logic
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('js/home-chris-pick-v2.js')
          s = p.read_text(encoding='utf-8')
          pattern = r"\n  async function discoverWorshipPicks\(\)\{.*?\n  \}\n\n  function mergeWorshipPicks\(discovered\)\{.*?\n  \}\n"
          replacement = "\n"
          s2, n = re.subn(pattern, replacement, s, flags=re.S)
          if n != 1:
              raise SystemExit(f'Eligibility block match count: {n}')
          s2 = s2.replace("    const discovered=await discoverWorshipPicks();\n    const eligiblePicks=mergeWorshipPicks(discovered);", "    const eligiblePicks=PICKS;")
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit source fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/home-chris-pick-v2.js .github/workflows/fix-chris-pick-eligibility.yml
          git commit -m "Fix Chris's Pick eligibility scope" -- js/home-chris-pick-v2.js .github/workflows/fix-chris-pick-eligibility.yml
          git push origin HEAD:develop