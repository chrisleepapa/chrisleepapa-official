name: Apply shared game authentication

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-game-auth:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add shared auth and SISTER SQUAD 2 story enhancement
        shell: bash
        run: |
          set -euo pipefail
          files=(
            game.html
            booktop.html
            tetris.html
            switch.html
            curling.html
            fiveinrow.html
            miracleshot.html
            gameinfo.html
          )

          for file in "${files[@]}"; do
            test -f "$file" || { echo "Missing $file"; exit 1; }
            if grep -q 'src="/js/game-auth.js"' "$file"; then
              echo "Already linked: $file"
              continue
            fi
            python3 - "$file" <<'PY'
import sys
from pathlib import Path
path = Path(sys.argv[1])
text = path.read_text(encoding='utf-8')
marker = '</head>'
idx = text.lower().find(marker)
if idx < 0:
    raise SystemExit(f'No </head> found in {path}')
insert = '    <script src="/js/game-auth.js"></script>\n'
path.write_text(text[:idx] + insert + text[idx:], encoding='utf-8')
PY
          done

          python3 - <<'PY'
          from pathlib import Path
          p=Path('sistersquad2.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/js/sistersquad2-story.js?v=20260827" defer></script>'
          if tag not in s:
              marker='    <!-- ★ 공통 푸터 -->'
              idx=s.find(marker)
              if idx < 0:
                  raise SystemExit('No footer marker found in sistersquad2.html')
              s=s[:idx] + '    ' + tag + '\n\n' + s[idx:]
              p.write_text(s,encoding='utf-8')
          PY

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.html booktop.html tetris.html switch.html curling.html fiveinrow.html miracleshot.html gameinfo.html sistersquad2.html
          git rm .github/workflows/apply-game-auth.yml .github/workflows/attach-ss2-story.yml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Connect shared auth and enhance SISTER SQUAD 2"
          git pull --rebase origin main
          git push origin main

# One-time workflow for safe shared-auth and SISTER SQUAD 2 content integration.
