const getJSON=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}},put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

function localDate(){const d=new Date(),y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}function profileKey(date){return 'chrisleepapa-today-'+profile+'-'+(date||localDate())}function streakKey(){return 'chrisleepapa-today-streak-'+profile}function readStreak(){return getJSON(streakKey(),{dates:[]})}function writeStreak(v){put(streakKey(),v)}async function loadRemoteStreak(){if(!profile)return readStreak();try{const r=await fetch('https://cvfmkcxmxkmemmshfttn.supabase.co/rest/v1/clp_today?select=record_date,data&account_id=eq.'+encodeURIComponent(profile)+'&order=record_date.asc',{headers:{apikey:'sb_publishable_BbG_kRPWRFeAPvIduwPTJg_O1z_sStm',Authorization:'Bearer sb_publishable_BbG_kRPWRFeAPvIduwPTJg_O1z_sStm'}});if(!r.ok)return readStreak();const rows=await r.json();const dates=(Array.isArray(rows)?rows:[]).filter(x=>x&&x.data&&x.data.checkin===true).map(x=>x.record_date).filter(Boolean);const s={dates:[...new Set([...readStreak().dates,...dates])].sort()};writeStreak(s);return s}catch(_){return readStreak()}}async function markCheckin(){const s=readStreak(),d=localDate();if(!Array.isArray(s.dates))s.dates=[];if(!s.dates.includes(d))s.dates.push(d);s.dates.sort();writeStreak(s);try{const session=window.CLPAuth?.getUser?.();if(session?.initials&&session?.pinHash){const existing=getJSON(profileKey(),{todos:[],memo:'',prayer:''});existing.checkin=true;localStorage.setItem(profileKey(),JSON.stringify(existing));await fetch('https://cvfmkcxmxkmemmshfttn.supabase.co/rest/v1/rpc/clp_save_today',{method:'POST',headers:{apikey:'sb_publishable_BbG_kRPWRFeAPvIduwPTJg_O1z_sStm',Authorization:'Bearer '+sbKey(),'Content-Type':'application/json'},body:JSON.stringify({p_initials:session.initials,p_pin_hash:session.pinHash,p_date:d,p_data:existing})})}}catch(_){}return s}function sbKey(){return 'sb_publishable_BbG_kRPWRFeAPvIduwPTJg_O1z_sStm'}function streakCount(s){const dates=new Set(s.dates||[]),d=new Date(localDate()+'T00:00:00');let n=0;while(dates.has(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))){n++;d.setDate(d.getDate()-1)}return n}function quizStorageKey(){return profileKey()+'-quiz'}function saveQuiz(){put(quizStorageKey(),{date:localDate(),score:quizScore,answered:quizIndex,completed:quizIndex>=todayQuiz.length})}function loadQuiz(){const saved=getJSON(quizStorageKey(),null);todayQuiz=todayQuizSet();quizIndex=0;quizScore=0;if(saved&&saved.date===localDate()&&saved.completed){quizIndex=todayQuiz.length;quizScore=Number(saved.score)||0}}function renderQuiz(){const lang=window.getCurrentLang?window.getCurrentLang():'ko',count=document.getElementById('quizCount'),qEl=document.getElementById('quizQuestion'),opts=document.getElementById('quizOptions'),feedback=document.getElementById('quizFeedback'),next=document.getElementById('quizNext'),result=document.getElementById('quizResult');if(quizIndex>=todayQuiz.length){count.textContent='5 / 5';qEl.textContent=lang==='en'?'Quiz complete.':'퀴즈 완료';opts.innerHTML='';feedback.hidden=true;next.hidden=true;result.hidden=false;result.textContent=(lang==='en'?'Today’s score: ':'오늘의 점수: ')+quizScore+'/5';document.getElementById('todayCheckinBtn').hidden=false;return}const item=todayQuiz[quizIndex];count.textContent=(quizIndex+1)+' / 5';qEl.textContent=item.q;opts.innerHTML='';feedback.hidden=true;next.hidden=true;result.hidden=true;item.o.forEach((label,i)=>{const b=document.createElement('button');b.type='button';b.className='quiz-option';b.textContent=label;b.addEventListener('click',()=>answerQuiz(i));opts.appendChild(b)})}function answerQuiz(choice){if(quizAnswered)return;quizAnswered=true;const item=todayQuiz[quizIndex],correct=choice===item.a;if(correct)quizScore++;document.querySelectorAll('.quiz-option').forEach((b,i)=>{b.disabled=true;if(i===item.a)b.classList.add('correct');if(i===choice&&i!==item.a)b.classList.add('wrong')});const f=document.getElementById('quizFeedback');f.hidden=false;f.textContent=(correct?'✓ ':'✕ ')+item.e;document.getElementById('quizNext').hidden=false;document.getElementById('quizNext').textContent=quizIndex===todayQuiz.length-1?'결과 보기 →':'다음 문제 →';saveQuiz()}function nextQuiz(){quizIndex++;quizAnswered=false;saveQuiz();renderQuiz();if(quizIndex>=todayQuiz.length){markCheckin().then(()=>renderRoutine())}}async function renderRoutine(){const d=window.PAGE_I18N[window.getCurrentLang?window.getCurrentLang():'ko']||window.PAGE_I18N.ko;loadQuiz();const s=await loadRemoteStreak(),count=streakCount(s);document.getElementById('todayStreak').textContent=count;const btn=document.getElementById('todayCheckinBtn');btn.textContent=count>0?d.today_checkin_done:d.today_checkin;btn.classList.toggle('done',count>0);btn.disabled=count>0;const box=document.getElementById('todayWeekProgress');box.innerHTML='';const now=new Date(),dayIndex=now.getDay()||7;for(let i=1;i<=7;i++){const el=document.createElement('span');el.className='routine-day '+(i<=dayIndex?'on':'');box.appendChild(el)}document.getElementById('todayRoutineMeta').textContent=d.today_routine_progress+' · '+count+' '+((window.getCurrentLang?window.getCurrentLang():'ko')==='en'?'day'+(count===1?'':'s'):'일');renderQuiz()}
function updateTodayLanguage(lang){const d=window.PAGE_I18N[lang]||window.PAGE_I18N.ko;document.getElementById('todayDate').textContent=new Intl.DateTimeFormat(d.today_date_locale,{dateStyle:'full'}).format(new Date());document.getElementById('todayVerse').textContent='“'+(lang==='en'?verse[2]:verse[0])+'”';document.getElementById('todayRef').textContent=lang==='en'?verse[3]:verse[1];document.getElementById('todoInput').placeholder=d.todo_placeholder;document.getElementById('todayMemo').placeholder=d.memo_placeholder;document.getElementById('todayPrayer').placeholder=d.prayer_placeholder;renderRoutine();document.getElementById('todayAuth').querySelector('#authInitials').placeholder=lang==='en'?'INITIALS (e.g. CLP)':'INITIALS (예: CLP)';document.getElementById('todayAuth').querySelector('#authPin').placeholder=lang==='en'?'4-DIGIT PIN':'4자리 PIN';renderTodos&&renderTodos()}

async function login(){const ini=document.getElementById('authInitials').value.trim().toUpperCase();const pin=document.getElementById('authPin').value.trim();const err=document.getElementById('authError');err.textContent='';const result=await window.CLPAuth.login(ini,pin,true);if(!result.ok){err.textContent=result.error;return}profile=result.initials;sessionStorage.setItem('clp-today-profile',profile);startToday()}

async function createTodayWordCard(){const lang=window.getCurrentLang?window.getCurrentLang():'ko';const title=lang==='en'?"TODAY’S WORD":"오늘의 말씀";const quote=lang==='en'?verse[2]:verse[0];const ref=lang==='en'?verse[3]:verse[1];const canvas=document.createElement('canvas');const size=1200;canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d');ctx.fillStyle='#030305';ctx.fillRect(0,0,size,size);const grad=ctx.createLinearGradient(0,0,size,size);grad.addColorStop(0,'rgba(201,168,76,.16)');grad.addColorStop(1,'rgba(201,168,76,.025)');ctx.fillStyle=grad;ctx.fillRect(0,0,size,size);ctx.strokeStyle='rgba(201,168,76,.48)';ctx.lineWidth=2;ctx.strokeRect(55,55,size-110,size-110);ctx.strokeStyle='rgba(201,168,76,.14)';ctx.lineWidth=1;ctx.strokeRect(72,72,size-144,size-144);ctx.textAlign='center';ctx.fillStyle='#c9a84c';ctx.font='600 30px Cinzel, serif';ctx.fillText(title.toUpperCase(),size/2,165);ctx.fillStyle='#eee8d8';ctx.font=lang==='en'?'500 45px "Noto Sans", sans-serif':'500 43px "Noto Sans KR", sans-serif';const maxWidth=900;const words=lang==='en'?quote.split(/\\s+/):Array.from(quote);let lines=[],line='';for(const word of words){const test=lang==='en'?(line?line+' '+word:word):(line+word);if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);const lineHeight=lang==='en'?70:78;let y=size/2-(lines.length-1)*lineHeight/2;ctx.fillText('“',size/2,y-72);for(const l of lines){ctx.fillText(l,size/2,y);y+=lineHeight}ctx.fillStyle='#c9a84c';ctx.font='600 28px "Noto Sans KR", sans-serif';ctx.fillText('— '+ref,size/2,y+42);ctx.fillStyle='rgba(238,238,238,.42)';ctx.font='400 20px "Noto Sans KR", sans-serif';ctx.fillText('Chris LEE.PAPA  ·  chrisleepapa-official.vercel.app',size/2,size-105);return new Promise(resolve=>canvas.toBlob(blob=>resolve(blob),'image/png'))}
async function saveTodayWord(){const btn=document.getElementById('todaySaveBtn');try{const blob=await createTodayWordCard();if(!blob)throw new Error('image creation failed');const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='todays-word.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);btn.classList.add('copied');setTimeout(()=>btn.classList.remove('copied'),1600)}catch(e){console.error('Today Word save failed:',e)}}
