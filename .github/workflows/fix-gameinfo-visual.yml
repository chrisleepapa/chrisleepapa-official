name: Surgical Game Center visual fix

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1
      - name: Patch gameinfo only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('gameinfo.html')
          s = p.read_text(encoding='utf-8')
          old = """        .game-card-image-mode .card-image-bg {\n            position: absolute;\n            inset: 0;\n            background-size: contain;\n            background-position: center;\n            background-repeat: no-repeat;\n            z-index: -2;"""
          new = """        .game-card-image-mode .card-image-bg {\n            position: absolute;\n            inset: 0;\n            background-size: contain;\n            background-position: center;\n            background-repeat: no-repeat;\n            z-index: 0;"""
          if old not in s:
              raise SystemExit('card image CSS target not found')
          s = s.replace(old, new, 1)
          s = s.replace("""            z-index: -1;\n            pointer-events: none;\n        }\n        .game-card-image-mode:hover {""", """            z-index: 1;\n            pointer-events: none;\n        }\n        .game-card-image-mode:hover {""", 1)
          s = s.replace(".game-card-content-wrap { position: relative; z-index: 1; width: 100%; }", ".game-card-content-wrap { position: relative; z-index: 2; width: 100%; }", 1)
          s = s.replace("            z-index: 2;\n            font-family: 'Cinzel', serif;", "            z-index: 3;\n            font-family: 'Cinzel', serif;", 1)
          s = s.replace("data-i18n=\"guide6_heading\">⑦ 요정 포포의 여정", "data-i18n=\"guide6_heading\">⑥ 요정 포포의 여정", 1)
          s = s.replace("data-i18n=\"guide7_heading\">⑦ 골이예요 GOAL", "data-i18n=\"guide7_heading\">⑦ 골이예요 GOAL", 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gameinfo.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: restore Game Center card image layering"
          git push origin develop
          rm -f .github/workflows/fix-gameinfo-visual.yml
          git add .github/workflows/fix-gameinfo-visual.yml
          git commit -m "chore: remove temporary Game Center visual fix workflow"
          git push origin develop
