name: Restore Bible file
on:
  push:
    branches: [develop]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore bible.html and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout 63e0164e897d2266772fd7cef60c1c4a9b7230b8 -- bible.html
          git rm .github/workflows/restore-bible.yml
          git add bible.html
          git commit -m 'chore: restore Bible page after accidental overwrite'
          git push
