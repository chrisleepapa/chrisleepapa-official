<style>
/* SISTER SQUAD hub project cards */
.sq-links .sq-link{
    position:relative;
    overflow:hidden;
    min-height:190px;
    isolation:isolate;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:24px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.16);
    background-color:#15151b;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease;
}

.sq-links .sq-link::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:0;
    background:linear-gradient(180deg,rgba(3,3,5,.12) 0%,rgba(3,3,5,.38) 42%,rgba(3,3,5,.9) 100%);
    pointer-events:none;
}

.sq-links .sq-link:hover{
    transform:translateY(-5px);
    border-color:rgba(232,208,138,.85);
    box-shadow:0 16px 40px rgba(0,0,0,.35);
}

.sq-links .sq-link b,
.sq-links .sq-link small{
    position:relative;
    z-index:1;
    text-shadow:0 2px 14px rgba(0,0,0,.9);
}

.sq-links .sq-link b{
    color:#fff;
    font:700 1rem Cinzel,serif;
    letter-spacing:.08em;
}

.sq-links .sq-link small{
    color:rgba(255,255,255,.88);
    font-size:.72rem;
}

.sq-links .sq-link:nth-child(1){
    background-image:url('/images/og_share.png');
}

.sq-links .sq-link:nth-child(2){
    background-image:url('/images/sistersquad2_poster.jpg');
}

.sq-links .sq-link:nth-child(3){
    background-image:url('/images/dynamicomok.png');
}

@media(max-width:760px){
    .sq-links .sq-link{min-height:165px}
}
</style>

<footer>
    <p data-i18n="footer_text">© 2026 Chris LEE.PAPA — The Creative Archive</p>
