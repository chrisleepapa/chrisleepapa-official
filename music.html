<style>
:root{--gold:#c9a84c;--gold-light:#e8d08a;--bg:#030305;--text:#f0ece4;--dim:#9a9490;--green:#1DB954}html,body{background:var(--bg);color:var(--text)}body{margin:0;font-family:Pretendard,'Noto Serif KR',sans-serif;line-height:1.6;overflow-x:hidden}a{text-decoration:none;color:inherit}.page-header{height:270px;display:flex;align-items:center;justify-content:center;text-align:center;padding-top:60px}.header-title{font-family:serif;font-size:clamp(2rem,8vw,3.5rem);letter-spacing:.15em;color:#fff}.header-slogan{color:var(--dim)}.interactive-player-wrapper{max-width:1200px;margin:0 auto 70px;padding:0 20px;display:flex;gap:35px}.player-focus,.playlist-sidebar{background:rgba(15,15,20,.55);border:1px solid rgba(255,255,255,.07);border-radius:24px}.player-focus{flex:1.5;padding:40px}.playlist-sidebar{flex:1;padding:25px;max-height:650px;overflow:auto}.album-art-large{width:min(280px,70vw);aspect-ratio:1;margin:0 auto 30px;border-radius:18px;background:#111 center/cover no-repeat;box-shadow:0 20px 50px rgba(0,0,0,.55)}.active-info{text-align:center}.active-info h2{font-size:2rem;margin:0 0 8px}.active-badge{display:inline-block;padding:5px 15px;border:1px solid rgba(29,185,84,.35);border-radius:20px;color:var(--green);font-size:.75rem}.spotify-container{height:380px;margin-top:22px;border-radius:16px;overflow:hidden;background:#0a0a0f}.spotify-container iframe{width:100%;height:100%;border:0}.external-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.external-link-btn{padding:11px 18px;border-radius:24px;color:var(--green);background:rgba(29,185,84,.08);border:1px solid rgba(29,185,84,.3);font-size:.85rem}.youtube-link{color:#ff6666;background:rgba(255,60,60,.08);border-color:rgba(255,60,60,.3)}.playlist-header{font-family:serif;color:var(--gold);letter-spacing:.15em;font-size:1.1rem;padding-bottom:15px;border-bottom:1px solid rgba(201,168,76,.2);margin-bottom:15px}.track-item{display:flex;gap:13px;align-items:center;padding:12px;border-radius:14px;cursor:pointer;border:1px solid transparent;margin-bottom:8px}.track-item:hover,.track-item.active{background:rgba(29,185,84,.07);border-color:rgba(29,185,84,.2)}.track-thumb{width:58px;height:58px;object-fit:cover;border-radius:10px;background:#111;flex:none}.track-details{min-width:0}.track-details h4{margin:0;color:#fff;font-size:.95rem;font-weight:500}.track-details p{margin:3px 0 0;color:#888;font-size:.75rem}.archive{max-width:960px;margin:0 auto 60px;padding:0 20px}.archive-box{border:1px solid rgba(201,168,76,.15);border-radius:20px;padding:30px;background:rgba(10,10,18,.7)}.archive h2,.archive h3{font-family:serif;color:var(--gold)}.archive-intro{color:#c8c4bc}.archive-list{display:flex;flex-direction:column;gap:15px}.archive-album{padding:18px;border:1px solid rgba(255,255,255,.07);border-radius:14px}.archive-album-title{color:var(--gold-light);font-weight:600}.archive-tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:7px;margin-top:10px}.archive-track{color:#aaa;padding:6px 9px;background:rgba(201,168,76,.04);border-radius:7px;font-size:.82rem}.archive-total{text-align:center;color:#777;font-size:.8rem;margin-top:25px}@media(max-width:900px){.interactive-player-wrapper{flex-direction:column;padding:0 10px}.player-focus{padding:25px 15px}.playlist-sidebar{max-height:none}.spotify-container{height:400px}}
</style>

<body>
<div id="site-nav"></div>
<header class="page-header"><div><h1 class="header-title">MUSIC ARCHIVE</h1><p class="header-slogan">AI가 만들어낸 선율, 영혼을 울리는 멜로디</p></div></header>
<main class="interactive-player-wrapper"><section class="player-focus"><div class="album-art-large" id="main-cover"></div><div class="active-info"><h2 id="main-title"></h2><span class="active-badge" id="main-type"></span></div><div class="spotify-container" id="spotify-container"></div><div class="external-row"><a id="main-external-link" class="external-link-btn" target="_blank" rel="noopener">Spotify에서 앨범 듣기 ›</a><a id="main-youtube-link" class="external-link-btn youtube-link" target="_blank" rel="noopener">YouTube에서 듣기 ›</a></div></section><aside class="playlist-sidebar"><div class="playlist-header">ALBUMS</div><div id="playlist-container"></div></aside></main>
<section class="archive"><div class="archive-box"><h2>✦ MUSIC ARCHIVE</h2><p class="archive-intro">Chris LEE.PAPA의 음악 작업과 글로벌 플랫폼 발매 작품을 한 곳에서 소개합니다.</p><h3>✦ ALBUMS & TRACKLIST</h3><div class="archive-list" id="archive-list"></div><p class="archive-total" id="archive-total"></p></div></section>
<div id="site-footer"></div>
<script>
const musicData=[
{title:'When the city stood still',type:'Album',id:'5qWOsYCJgw1bmXqvko7Thv',youtube:'https://youtube.com/playlist?list=OLAK5uy_kG2JbLRrBozj00d8VChsbBc11bzCEIfx8&si=kW47ZC7X99F9PXji',tracks:['When the city stood still','After the rain','When did the years go','Remember','Night Breeze','Disco reborn','Guitar Hero','Master Bassist']},
{title:'We own the Cup',type:'Album',id:'0sR4hKvhzN4U2GaQKx6Qek',youtube:'https://youtube.com/playlist?list=OLAK5uy_mvAOU96N-lOaZhLlvjkxgskXZsiThl9w4&si=jE1OSt5P0IVLFr76',tracks:['Feel the Power','We own the Cup','Summer never dies','Feel the Power - Inst','We own the Cup - Inst','Summer never dies - Inst','여름끝까지 - Kor']},
{title:'Spotify Release',type:'Album',id:'1K2UDyLeDFF7Ti5KzMknWN',youtube:'https://youtube.com/playlist?list=OLAK5uy_lJjcn058-VL0vQP20esgyZQgscxthJ7nA&si=KVGnzXp3Oe3qkOWY',tracks:[]},
{title:'Run it back',type:'EP',id:'1VCjArWmxZJakdawRkEeCi',youtube:'https://youtube.com/playlist?list=OLAK5uy_kxF7pHc4VsbT__Vp2FQHidyD84EszOXDU&si=jNfGCn5a9EbU1fmr',trackCount:4,tracks:['Run it back']},
{title:'To The Space',type:'Single',id:'1JyYgZ8VTbh5mASNezCTcJ',youtube:'https://youtube.com/playlist?list=OLAK5uy_lb1VjkTruoTa6uo8P8Y8Trc0jGqx0cJYk&si=CrM-fws1toWG9d8M',tracks:['To The Space']},
{title:'Ensemble',type:'EP',id:'2X3dnf8vnhCSQ0c7H9oZht',youtube:'https://youtube.com/playlist?list=OLAK5uy_m4zm9Qq57sWlvBb_W7l57NPOkcrbAuLBo&si=6x4x7eT0FzIEf8OF',tracks:['Emotional','Ensemble','Climax','Groove','Impact','Energetic']},
{title:'To Rise',type:'Instrumental',id:'2OSKuof7gooLElmFYvoygK',youtube:'https://youtube.com/playlist?list=OLAK5uy_ndXJukqI1ePIzltvjzIf4Vt2_KQroYszo&si=HTtRpOX2HqtGd0DD',tracks:['To Rise','Morning Breeze','Last Vibrato','Never Stop']},
{title:'영역전개',type:'Album',id:'6rZBdEFTJ5mLwINtn9C8KZ',youtube:'https://youtube.com/playlist?list=OLAK5uy_kEiTfwxIvjPCWweGFa2U0-xykLgQ000EI&si=8fCyOOXfj_mneWZ6',tracks:['영역전개','영역전개_inst']},
{title:'벽력일섬',type:'Album',id:'25T549XyXnmiZhqGn7p4x4',youtube:'https://youtube.com/playlist?list=OLAK5uy_lEWXJuSa8EXqjqnXVHZ5s5_dLw8Nucza8&si=2McCMqkCvnL_0vVp',tracks:['벽력일섬_Hekireki Issen','Rev It Up_kor','Rev It Up_eng','Hekireki Issen_Inst']},
{title:'2026 앨범',type:'Album',id:'2AzUPgjWYDodUqFTNjPU1l',youtube:'https://youtube.com/playlist?list=OLAK5uy_nSgyIsRm-YJyjjKOcNH9iN43bBxgQQgDQ&si=jpNOamkNkO7egSxP',tracks:['난리났어','2026','2026_Inst','Tonight_Inst','Flash Bang','Blow It Up']},
{title:'Spotify Release',type:'Album',id:'7F4P40iGbLcUceu1mTNdCF',youtube:'https://youtube.com/playlist?list=OLAK5uy_k9CYtBP5F8jnbb0I95tBvA2vTbuHF_eeE&si=RkW9R5WIRQNaXz_s',tracks:[]},
{title:'사랑한다고',type:'Vocal',id:'2s7tJtoaxDT8KUkJ3OL8DD',youtube:'https://youtube.com/playlist?list=OLAK5uy_m0lR-fY4rgZkgHvH4Wis2e7AfKyZGhtw0&si=PynL7dMkEwUTjaNW',tracks:['사랑한다고','Saying I love you','Winter\'s Symphony']}
];
const spotify=id=>`https://open.spotify.com/album/${id}`;
const embed=id=>`https://open.spotify.com/embed/album/${id}?utm_source=generator&theme=0`;
const oembed=id=>`https://open.spotify.com/oembed?url=${encodeURIComponent(spotify(id))}`;

function getInitialActiveIndex(){
  const params=new URLSearchParams(window.location.search);
  const requested=params.get('album')||params.get('id');
  if(requested){
    const index=musicData.findIndex(a=>a.id===requested);
    if(index>=0)return index;
  }
  const hash=decodeURIComponent((window.location.hash||'').replace(/^#/,'')).trim();
  if(hash){
    const index=musicData.findIndex(a=>a.id===hash||a.title.toLowerCase().replace(/\s+/g,'-')===hash.toLowerCase());
    if(index>=0)return index;
  }
  return 0;
}

let active=getInitialActiveIndex();const coverCache={};

async function loadCover(album){
  if(coverCache[album.id])return coverCache[album.id];
  try{
    const r=await fetch(oembed(album.id),{cache:'force-cache'});
    if(!r.ok)throw new Error('oEmbed failed');
    const d=await r.json();
    if(d.thumbnail_url){coverCache[album.id]=d.thumbnail_url;return d.thumbnail_url}
  }catch(e){console.warn('Spotify cover unavailable:',album.title,e)}
  return '';
}

function setImageSource(img,album){
  const url=coverCache[album.id];
  if(url){img.src=url;img.style.visibility='visible'}else{img.removeAttribute('src');img.style.visibility='hidden'}
  img.onerror=()=>{img.removeAttribute('src');img.style.visibility='hidden'};
}

async function hydrateCovers(){
  await Promise.all(musicData.map(a=>loadCover(a)));
  renderPlaylist();
  renderActive();
}

function renderPlaylist(){
  const box=document.getElementById('playlist-container');
  box.innerHTML='';
  musicData.forEach((a,i)=>{
    const count=a.trackCount||a.tracks.length;
    const item=document.createElement('div');
    item.className='track-item'+(i===active?' active':'');
    item.onclick=()=>{active=i;renderPlaylist();renderActive();};
    const img=document.createElement('img');
    img.className='track-thumb';img.dataset.albumId=a.id;img.alt=`${a.title} album cover`;setImageSource(img,a);item.appendChild(img);
    const details=document.createElement('div');details.className='track-details';details.innerHTML=`<h4>${a.title}</h4><p>${a.type} · ${count} TRACK${count===1?'':'S'}</p>`;item.appendChild(details);box.appendChild(item);
  });
}

function renderActive(){
  const a=musicData[active];
  document.getElementById('main-title').textContent=a.title;
  document.getElementById('main-type').textContent=a.type;
  document.getElementById('main-external-link').href=spotify(a.id);
  const y=document.getElementById('main-youtube-link');y.href=a.youtube;y.hidden=!a.youtube;
  document.getElementById('spotify-container').innerHTML=`<iframe src="${embed(a.id)}" title="${a.title} Spotify player" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
  const cover=coverCache[a.id];document.getElementById('main-cover').style.backgroundImage=cover?`url("${cover}")`:'';
  document.querySelectorAll('.track-item').forEach((el,i)=>el.classList.toggle('active',i===active));
}

function renderArchive(){const box=document.getElementById('archive-list');let total=0;box.innerHTML=musicData.map(a=>{const count=a.trackCount||a.tracks.length;total+=count;const shown=a.tracks.length?`<div class="archive-tracks">${a.tracks.map((t,i)=>`<div class="archive-track"><b>${i+1}</b>${t}</div>`).join('')}</div>`:`<div class="archive-track">Tracklist available on Spotify</div>`;return `<div class="archive-album"><div class="archive-album-title">${a.title} · ${a.type} · ${count} TRACK${count===1?'':'S'}</div>${shown}</div>`}).join('');document.getElementById('archive-total').textContent=`TOTAL ${total} TRACKS`}

renderPlaylist();renderArchive();renderActive();hydrateCovers();
</script>
<script src="js/main.js"></script>
</body></html>
