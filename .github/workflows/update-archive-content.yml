name: Update archive content
on:
  push:
    branches: [develop]
    paths: ['.archive-update-trigger']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Update MUSIC, WORSHIP and Chris Pick
        shell: python
        run: |
          from pathlib import Path
          import re

          music = Path('music.html')
          s = music.read_text(encoding='utf-8')
          if 'title_ko: \'Run it back\'' not in s:
              needle = "            { title_ko: 'We own the Cup',"
              pos = s.find(needle)
              if pos < 0: raise SystemExit('music anchor not found')
              line_end = s.find('\n', pos)
              entry = "            { title_ko: 'Run it back', title_en: 'Run It Back', type_ko: '싱글', type_en: 'Single', albumId: '6zhb0e3KvoFY5pcefQUHA6', cover: 'images/music.jpg', embedUrl: 'https://open.spotify.com/embed/artist/6zhb0e3KvoFY5pcefQUHA6', externalUrl: 'https://open.spotify.com/artist/6zhb0e3KvoFY5pcefQUHA6' },\n"
              s = s[:pos] + entry + s[pos:]
          s = s.replace('등 9개 앨범 41곡.', '등 10개 작품 42곡.')
          s = s.replace('9 albums, 41 tracks.', '10 works, 42 tracks.')
          # Make the external button use an explicit URL when provided.
          s = s.replace("mainExternalLink.href = `https://open.spotify.com/album/${track.albumId}`;", "mainExternalLink.href = track.externalUrl || `https://open.spotify.com/album/${track.albumId}`;")
          music.write_text(s, encoding='utf-8')

          worship = Path('worship.html')
          w = worship.read_text(encoding='utf-8')
          if 'images/My hymn3.jpg' not in w:
              grid = w.find('<div class="albums-grid">')
              if grid < 0: raise SystemExit('worship grid not found')
              insert_at = w.find('\n', grid) + 1
              card = '''<a class="album-card" href="https://open.spotify.com/artist/6zhb0e3KvoFY5pcefQUHA6" target="_blank" rel="noopener" aria-label="나의 찬양 Vol. 3 Spotify">
  <img class="album-cover" src="images/My hymn3.jpg" alt="나의 찬양 Vol. 3" loading="lazy">
  <div class="album-cover-overlay"></div>
  <div class="album-info">
    <span class="album-vol-badge">Vol. 3 · Korean Worship</span>
    <div class="album-title">나의 찬양 Vol. 3</div>
    <div class="album-cta"><span>Spotify에서 듣기</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12,5 19,12 12,19"/></svg></div>
  </div>
</a>
'''
              w = w[:insert_at] + card + w[insert_at:]
          w = w.replace('Vol.1(The First Confession), Vol.2(2nd Confession).', 'Vol.1(The First Confession), Vol.2(2nd Confession), Vol.3, SHOUT.')
          w = w.replace('나의 찬양 Vol.1 · Vol.2.', '나의 찬양 Vol.1 · Vol.2 · Vol.3 · SHOUT.')
          worship.write_text(w, encoding='utf-8')

          pick = Path('js/home-chris-pick-v2.js')
          p = pick.read_text(encoding='utf-8')
          if "title:'Shout'" not in p:
              anchor = "    {type:'WORSHIP',icon:'♩',title:'나의 찬양 Vol.3'"
              pos = p.find(anchor)
              if pos < 0: raise SystemExit('Chris Pick Vol.3 anchor not found')
              line_end = p.find('\n', pos)
              shout = "    {type:'WORSHIP',icon:'♩',title:'Shout',sub:'English Worship',desc:{ko:'영어로 함께 외치는 찬양과 예배의 메시지를 담은 워십 작품입니다.',en:'An English worship work carrying a message of praise and worship to be sung together.'},image:'/images/og_share.png',href:'worship.html',action:{ko:'워십 보기',en:'View Worship'}},\n"
              p = p[:line_end+1] + shout + p[line_end+1:]
          pick.write_text(p, encoding='utf-8')

          print('Archive content updated: Run it back, 나의 찬양 Vol.3, SHOUT preserved.')
      - name: Validate
        run: |
          grep -q "Run it back" music.html
          grep -q "나의 찬양 Vol. 3" worship.html
          grep -q "images/My hymn3.jpg" worship.html
          grep -q "title:'Shout'" js/home-chris-pick-v2.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add music.html worship.html js/home-chris-pick-v2.js
          git diff --cached --quiet || git commit -m 'Add Run it back and Worship Vol.3'
          git push origin develop
