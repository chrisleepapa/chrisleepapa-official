name: Update About Timeline

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-timeline:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'Update About timeline content'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1

      - name: Replace timeline and translations
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('about.html')
          s = p.read_text(encoding='utf-8')

          timeline = '''            <div class="timeline-items">

                <!-- 2025.07 -->
                <article class="timeline-item">
                    <div class="timeline-year">2025.07</div>
                    <div class="timeline-content">
                        <strong data-i18n="time1_title">THE BEGINNING</strong>
                        <p data-i18n="time1_desc">AI를 활용한 창작을 처음 시도하며 새로운 창작의 가능성을 발견했습니다.</p>
                    </div>
                </article>

                <!-- 2025.09 -->
                <article class="timeline-item">
                    <div class="timeline-year">2025.09</div>
                    <div class="timeline-content">
                        <strong data-i18n="time2_title">SISTER SQUAD 1</strong>
                        <p data-i18n="time2_desc">첫 번째 오리지널 IP, SISTER SQUAD가 탄생했습니다.</p>
                    </div>
                </article>

                <!-- 2025.10 -->
                <article class="timeline-item">
                    <div class="timeline-year">2025.10</div>
                    <div class="timeline-content">
                        <strong data-i18n="time3_title">MUSIC PRODUCING</strong>
                        <p data-i18n="time3_desc">AI를 활용한 음악 제작을 본격적으로 시작했습니다.</p>
                    </div>
                </article>

                <!-- 2026.01 -->
                <article class="timeline-item">
                    <div class="timeline-year">2026.01</div>
                    <div class="timeline-content">
                        <strong data-i18n="time4_title">MY FAITH JOURNEY</strong>
                        <p data-i18n="time4_desc">나의 믿음의 여정을 음악에 담기 시작하며 Worship 프로젝트를 시작했습니다.</p>
                    </div>
                </article>

                <!-- 2026.05 -->
                <article class="timeline-item">
                    <div class="timeline-year">2026.05</div>
                    <div class="timeline-content">
                        <strong data-i18n="time5_title">THE CREATIVE ARCHIVE</strong>
                        <p data-i18n="time5_desc">음악, 문학, 영상, 게임, 신앙 등 창작물을 하나의 공간에 모으기 시작했습니다.</p>
                    </div>
                </article>

                <!-- 2026.07 -->
                <article class="timeline-item">
                    <div class="timeline-year">2026.07</div>
                    <div class="timeline-content">
                        <strong data-i18n="time6_title">MIRACLE SHOT</strong>
                        <p data-i18n="time6_desc">새로운 오리지널 스토리 IP, Miracle Shot이 탄생했습니다.</p>
                    </div>
                </article>

                <!-- 2026.08 -->
                <article class="timeline-item">
                    <div class="timeline-year">2026.08</div>
                    <div class="timeline-content">
                        <strong data-i18n="time7_title">SISTER SQUAD 2</strong>
                        <p data-i18n="time7_desc">SISTER SQUAD의 새로운 이야기로 시리즈를 이어갔습니다.</p>
                    </div>
                </article>

                <!-- 2026.09 -->
                <article class="timeline-item">
                    <div class="timeline-year">2026.09</div>
                    <div class="timeline-content">
                        <strong data-i18n="time8_title">CREATIVE ARCHIVE REBUILT</strong>
                        <p data-i18n="time8_desc">지금까지의 창작물을 다시 정리하고 The Creative Archive를 전면 재개편했습니다.</p>
                    </div>
                </article>

            </div>'''

          start_marker = '            <div class="timeline-items">'
          end_marker = '        <section\n            class="links-block"'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit(f'timeline markers not found: start={start}, end={end}')
          s = s[:start] + timeline + '\n\n\n' + s[end:]

          values = {
              'time1_title': ('THE BEGINNING', 'THE BEGINNING'),
              'time1_desc': ('AI를 활용한 창작을 처음 시도하며 새로운 창작의 가능성을 발견했습니다.', 'I first began exploring AI as a creative tool and discovered new possibilities for making things.'),
              'time2_title': ('SISTER SQUAD 1', 'SISTER SQUAD 1'),
              'time2_desc': ('첫 번째 오리지널 IP, SISTER SQUAD가 탄생했습니다.', 'My first original IP, SISTER SQUAD, was born.'),
              'time3_title': ('MUSIC PRODUCING', 'MUSIC PRODUCING'),
              'time3_desc': ('AI를 활용한 음악 제작을 본격적으로 시작했습니다.', 'I began producing music with AI in earnest.'),
              'time4_title': ('MY FAITH JOURNEY', 'MY FAITH JOURNEY'),
              'time4_desc': ('나의 믿음의 여정을 음악에 담기 시작하며 Worship 프로젝트를 시작했습니다.', 'I began putting my faith journey into music and started the Worship project.'),
              'time5_title': ('THE CREATIVE ARCHIVE', 'THE CREATIVE ARCHIVE'),
              'time5_desc': ('음악, 문학, 영상, 게임, 신앙 등 창작물을 하나의 공간에 모으기 시작했습니다.', 'I began bringing together my music, literature, video, games, and faith-related creations in one place.'),
              'time6_title': ('MIRACLE SHOT', 'MIRACLE SHOT'),
              'time6_desc': ('새로운 오리지널 스토리 IP, Miracle Shot이 탄생했습니다.', 'A new original story IP, Miracle Shot, was born.'),
              'time7_title': ('SISTER SQUAD 2', 'SISTER SQUAD 2'),
              'time7_desc': ('SISTER SQUAD의 새로운 이야기로 시리즈를 이어갔습니다.', 'I continued the SISTER SQUAD series with a new story.'),
              'time8_title': ('CREATIVE ARCHIVE REBUILT', 'CREATIVE ARCHIVE REBUILT'),
              'time8_desc': ('지금까지의 창작물을 다시 정리하고 The Creative Archive를 전면 재개편했습니다.', 'I reorganized my creations and completely rebuilt The Creative Archive.')
          }

          # Existing timeline translation keys are present twice (KO and EN).
          # Replace the first occurrence with Korean and the second with English.
          for key, (ko, en) in values.items():
              pat = re.compile(r'(\b' + re.escape(key) + r'\s*:\s*)["\'](?:[^"\']|\\.)*["\']')
              matches = list(pat.finditer(s))
              if len(matches) < 2:
                  raise SystemExit(f'{key}: expected 2 translation entries, found {len(matches)}')
              replacement_en = en.replace('"', '\\"')
              replacement_ko = ko.replace('"', '\\"')
              parts = []
              last = 0
              for i, m in enumerate(matches):
                  parts.append(s[last:m.start()])
                  value = replacement_ko if i == 0 else replacement_en
                  parts.append(m.group(1) + '"' + value + '"')
                  last = m.end()
              parts.append(s[last:])
              s = ''.join(parts)

          # Add new time6-time8 keys to both language objects if they are not already present.
          if 'time6_title:' not in s:
              anchor = re.compile(r'(\n\s*time5_desc:\s*"(?:[^"\\]|\\.)*",)')
              insert = '\n\n                time6_title: "MIRACLE SHOT",\n                time6_desc: "A new original story IP, Miracle Shot, was born.",\n                time7_title: "SISTER SQUAD 2",\n                time7_desc: "I continued the SISTER SQUAD series with a new story.",\n                time8_title: "CREATIVE ARCHIVE REBUILT",\n                time8_desc: "I reorganized my creations and completely rebuilt The Creative Archive.",'
              # This branch should not be reached because the HTML block contains data-i18n keys, not object keys.
              # Keep explicit failure rather than silently corrupting the page.
              raise SystemExit('New timeline translation keys were not found; aborting safely')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html
          git diff --cached --check
          git commit -m "Update About timeline content"
          git push origin HEAD:develop
