name: Apply TODAY archive v2

on:
  push:
    paths:
      - 'js/today-archive-v2.js'
      - '.github/workflows/apply-today-archive-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inject archive script
        shell: python
        run: |
          from pathlib import Path
          p=Path('today.html')
          text=p.read_text(encoding='utf-8')
          tag='<script src="js/today-archive-v2.js" defer></script>'
          if tag not in text:
              marker='<script src="js/auth.js"></script>'
              if marker not in text:
                  raise SystemExit('auth.js marker not found')
              text=text.replace(marker, marker+'\n'+tag, 1)
              p.write_text(text, encoding='utf-8')
      - name: Commit injection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add today.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Connect TODAY archive manager [skip ci]'
          git push origin HEAD:main
