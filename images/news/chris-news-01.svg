<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><rect width="1080" height="1920" fill="#faf9f6"/><text x="90" y="125" font-family="Arial" font-size="30" font-weight="700" letter-spacing="5" fill="#8b6a19">01 · INTERNATIONAL / POLITICS</text><text x="90" y="220" font-family="Arial" font-size="22" letter-spacing="4" fill="#6f6a61">OCTOBER 7 · 2026</text><rect x="90" y="270" width="110" height="5" fill="#c9a84c"/><text x="90" y="430" font-family="Georgia" font-size="30" fill="#8b6a19">ISRAEL · ELECTION</text><text x="90" y="690" font-family="Georgia" font-size="76" font-weight="700" fill="#302a20">October 7’s trauma</text><text x="90" y="795" font-family="Georgia" font-size="76" font-weight="700" fill="#302a20">shapes Israel’s election</text><foreignObject x="90" y="1040" width="900" height="360"><div xmlns="http://www.w3.org/1999/xhtml" style="font:400 31px Arial;line-height:1.75;color:#514d46">Three years after the Hamas-led attack, the memory of October 7 is shaping Israel’s political debate ahead of the October 27 election. Trauma, security concerns and criticism of the government remain central to the campaign.</div></foreignObject><line x1="90" y1="1500" x2="990" y2="1500" stroke="#d8d1c4" stroke-width="2"/><text x="90" y="1580" font-family="Arial" font-size="21" font-weight="700" letter-spacing="4" fill="#8b6a19">GLOBAL NEWS · CHRIS'S NEWS</text><text x="90" y="1645" font-family="Arial" font-size="27" fill="#514d46">AP · AL JAZEERA · GUARDIAN</text><text x="90" y="1780" font-family="Arial" font-size="24" font-weight="700" fill="#8b6a19">01</text><text x="990" y="1780" text-anchor="end" font-family="Arial" font-size="21" fill="#8b6a19">READ THE STORY →</text></svg>