name: Temporary Movie Metadata Update

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  update-movie-meta:
    if: github.event.head_commit.message == 'TEMP: update movie metadata'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update movie metadata only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('movie.html')
          s = p.read_text(encoding='utf-8')

          old_ko = 'Chris LEE.PAPA Movie Archive — AI 뮤직비디오 FURIOUS, 사랑한다고 MV 등 YouTube 영상 아카이브. Suno AI·생성형 AI 비주얼로 제작한 오리지널 영상 콘텐츠.'
          new_ko = 'Chris LEE.PAPA Movie Archive — FURIOUS, 귀멸의 칼날 실사 촬영 현장, 사랑한다고 등 AI 영상 작품을 소개합니다. 전쟁과 갈등, 애니메이션과 실사의 경계, 이별의 슬픔과 그리움을 음악과 생성형 AI 영상으로 표현했습니다.'
          old_en = "Chris LEE.PAPA Movie Archive — AI music video FURIOUS, Love Song MV and more on YouTube. Original video content produced with Suno AI and generative AI visuals."
          new_en = "Chris LEE.PAPA Movie Archive — AI video works including FURIOUS, a Demon Slayer live-action set concept, and Love Song MV. The archive explores war and conflict, the boundary between animation and live action, and grief and longing through music and generative AI visuals."

          replacements = [
              (old_ko, new_ko),
              (old_en, new_en),
              ('AI 뮤직비디오·단편 영화·쇼츠까지. Chris LEE.PAPA의 생성형 AI 영상 아카이브를 YouTube에서 감상하세요.', new_ko),
              ('프레임에 담긴 무한한 세계, 크리스리의 영상 아카이브를 감상해보세요.', new_ko),
              ("From AI music videos to short films and shorts. Watch Chris LEE.PAPA's generative AI video archive on YouTube.", new_en),
              ("An infinite world captured in a frame — explore Chris Lee's video archive.", new_en),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count == 0:
                  raise SystemExit(f'Expected metadata string not found: {old}')
              s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify scope
        run: |
          git diff --check
          git diff -- movie.html
          test "$(git diff --name-only)" = "movie.html"

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add movie.html
          git rm .github/workflows/_temp_movie_meta.yml
          git commit -m "Update movie metadata descriptions"
          git push
