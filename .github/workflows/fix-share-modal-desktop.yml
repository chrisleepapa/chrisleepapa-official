name: Fix desktop share modal
on:
  push:
    branches: [develop]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add global share modal styles
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('css/common.css')
          s = p.read_text()
          marker = '.toast-msg{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:4000}'
          styles = '''.modal-overlay{position:fixed;inset:0;z-index:3500;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}.modal-overlay.open,.modal-overlay.active{display:flex}.share-modal{width:min(420px,calc(100% - 30px));padding:28px;background:#0a0a0d;border:1px solid var(--border-strong);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.55)}.share-modal h3{font:700 1rem 'Cinzel',serif;color:var(--gold-light)}.share-modal p{margin:10px 0 20px;color:#999;font:400 .8rem 'Noto Sans KR',sans-serif}.share-buttons{display:flex;gap:8px}.modal-btn,.btn-close{border:1px solid var(--border);background:transparent;color:#ddd;padding:10px 14px;border-radius:8px;cursor:pointer}.modal-btn:hover,.btn-close:hover{color:var(--gold-light);border-color:var(--border-strong);background:rgba(201,168,76,.05)}.btn-close{margin-top:12px;width:100%}'''
          if styles not in s:
              s = s.replace(marker, marker + styles, 1)
              p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/common.css
          git diff --cached --quiet || git commit -m 'Fix desktop share modal styling'
          git push
