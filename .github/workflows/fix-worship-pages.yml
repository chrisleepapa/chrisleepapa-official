name: Fix worship page separation

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'chrisleepapa'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Remove SHOUT from Korean Worship only
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('worship.html')
          s = p.read_text(encoding='utf-8')
          original = s

          # Remove the complete album card whose visible/content text identifies it as SHOUT.
          patterns = [
              r'<article\b[^>]*class=["\'][^"\']*album-card[^"\']*["\'][^>]*>.*?</article>',
              r'<div\b[^>]*class=["\'][^"\']*album-card[^"\']*["\'][^>]*>.*?</div>'
          ]
          for pat in patterns:
              def repl(m):
                  block = m.group(0)
                  return '' if re.search(r'\bSHOUT\b|shout\.html|Shout', block, re.I) else block
              s = re.sub(pat, repl, s, flags=re.I | re.S)

          # If SHOUT remains outside a card, remove standalone links/cards by common markers.
          s = re.sub(r'<a\b[^>]*(?:href=["\'](?:[^"\']*shout[^"\']*)["\']|[^>]*>[^<]*SHOUT[^<]*</a>)[^>]*>.*?</a>', '', s, flags=re.I|re.S)

          # Korean page metadata must describe only Vol.1–3.
          s = re.sub(r'(?i)(<meta\s+name=["\']description["\']\s+content=["\'][^"\']*)(SHOUT|Shout)([^"\']*["\'])', r'\1\3', s)
          s = re.sub(r'(?i)(<meta\s+property=["\']og:description["\']\s+content=["\'][^"\']*)(SHOUT|Shout)([^"\']*["\'])', r'\1\3', s)

          if s != original:
              p.write_text(s, encoding='utf-8')
          else:
              print('No changes detected; preserving file unchanged.')
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worship.html
          git diff --cached --quiet && exit 0
          git commit -m 'Separate SHOUT from Korean Worship page'
          git push origin develop
      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/fix-worship-pages.yml
          git commit -m 'Remove one-time worship fix workflow'
          git push origin develop
