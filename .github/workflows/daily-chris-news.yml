name: Daily YouTube Top 3

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-youtube-top3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-youtube-top3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch yesterday's popular videos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node automation/generate-youtube-daily-top3.mjs
      - name: Commit updated video data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube-daily-top3.json
          if git diff --cached --quiet; then
            echo "YouTube data is unchanged; nothing to commit."
          else
            git commit -m "Refresh YouTube daily top 3 for $(date -u +%F)"
            git push origin HEAD:${{ github.ref_name }}
          fi
