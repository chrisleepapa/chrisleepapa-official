name: Update archive content
on:
  push:
    branches: [develop]
    paths: ['.archive-update-trigger']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Update archive files
        run: |
          python3 tools/rebuild-worship.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('music.html')
          s = p.read_text(encoding='utf-8')
          if "title_ko: 'Run it back'" not in s:
              marker = "            { title_ko: 'We own the Cup',"
              i = s.find(marker)
              if i < 0: raise SystemExit('musicData marker not found')
              entry = "            { title_ko: 'Run it back', title_en: 'Run It Back', type_ko: '싱글', type_en: 'Single', albumId: '6zhb0e3KvoFY5pcefQUHA6', cover: 'images/music.jpg', embedUrl: 'https://open.spotify.com/embed/artist/6zhb0e3KvoFY5pcefQUHA6', externalUrl: 'https://open.spotify.com/artist/6zhb0e3KvoFY5pcefQUHA6' },\n"
              s = s[:i] + entry + s[i:]
          s = s.replace('등 9개 앨범 41곡.', '등 10개 작품 42곡.')
          s = s.replace('9 albums, 41 tracks.', '10 works, 42 tracks.')
          s = s.replace("mainExternalLink.href = `https://open.spotify.com/album/${track.albumId}`;", "mainExternalLink.href = track.externalUrl || `https://open.spotify.com/album/${track.albumId}`;")
          p.write_text(s, encoding='utf-8')

          p = Path('js/home-chris-pick-v2.js')
          s = p.read_text(encoding='utf-8')
          if "title:'Shout'" not in s:
              marker = "    {type:'WORSHIP',icon:'♩',title:'나의 찬양 Vol.3'"
              i = s.find(marker)
              if i < 0: raise SystemExit('Chris Pick Vol.3 marker not found')
              i = s.find('\n', i) + 1
              shout = "    {type:'WORSHIP',icon:'♩',title:'Shout',sub:'English Worship',desc:{ko:'영어로 함께 외치는 찬양과 예배의 메시지를 담은 워십 작품입니다.',en:'An English worship work carrying a message of praise and worship to be sung together.'},image:'/images/og_share.png',href:'worship.html',action:{ko:'워십 보기',en:'View Worship'}},\n"
              s = s[:i] + shout + s[i:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate required content
        run: |
          grep -q "Run it back" music.html
          grep -q "id=\"shout-lyrics\"" worship.html
          grep -q "15 TRACKS" worship.html
          test "$(grep -c 'class=\"lyrics-item shout-track\"' worship.html)" -eq 15
          grep -q "title:'Shout'" js/home-chris-pick-v2.js
          grep -q "title:'나의 찬양 Vol.3'" js/home-chris-pick-v2.js
      - name: Commit archive changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worship.html music.html js/home-chris-pick-v2.js tools/shout-lyrics.json tools/rebuild-worship.py
          git diff --cached --quiet || git commit -m 'Rebuild Worship archive with SHOUT lyric book'
          git push origin develop
