name: Daily Today Word to Threads

on:
  schedule:
    # Daily schedule: 07:00 Korea Standard Time (KST) = 22:00 UTC on the previous day.
    # This schedule is intentionally kept on the default branch (main).
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: daily-today-word-threads
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post-today-word:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Production main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Render the exact Production Today’s Word image
        env:
          TODAY_URL: https://chrisleepapa-official.vercel.app/today
        run: |
          mkdir -p automation/threads
          cat > automation/render-today-word.mjs <<'EOF'
          import { createRequire } from 'node:module';
          import { writeFile } from 'node:fs/promises';

          // Keep the renderer inside the workspace so Node resolves Playwright from workspace/node_modules.
          const require = createRequire(import.meta.url);
          const { chromium } = require('playwright');

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1200 }, deviceScaleFactor: 1 });

          await page.goto(process.env.TODAY_URL, { waitUntil: 'networkidle', timeout: 120000 });

          await page.waitForFunction(() => typeof createTodayWordCard === 'function', null, { timeout: 30000 });
          await page.waitForFunction(() => typeof bibleVerses !== 'undefined' && bibleVerses.length > 0, null, { timeout: 60000 });
          await page.evaluate(async () => { await document.fonts.ready; });

          const base64 = await page.evaluate(async () => {
            // Threads should receive the Korean Today’s Word consistently.
            window.getCurrentLang = () => 'ko';
            const blob = await createTodayWordCard();
            if (!blob) throw new Error('createTodayWordCard() returned no image');
            const buffer = await blob.arrayBuffer();
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const chunk = 0x8000;
            for (let i = 0; i < bytes.length; i += chunk) {
              binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
            }
            return btoa(binary);
          });

          await writeFile('automation/threads/todays-word.png', Buffer.from(base64, 'base64'));
          await browser.close();
          EOF

          node automation/render-today-word.mjs

      - name: Publish image to public GitHub URL
        id: media
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The PNG was generated from Production main. Keep it outside the main worktree
          # while switching to the dedicated public-media branch.
          cp automation/threads/todays-word.png /tmp/todays-word.png

          git fetch origin threads-media 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/threads-media; then
            git checkout -B threads-media origin/threads-media --force
          else
            git checkout -B threads-media
          fi

          mkdir -p automation/threads
          cp /tmp/todays-word.png automation/threads/todays-word.png
          git add automation/threads/todays-word.png
          git commit -m "Update daily Today’s Word image" || true
          git push origin threads-media

          COMMIT_SHA="$(git rev-parse HEAD)"
          echo "image_url=https://raw.githubusercontent.com/chrisleepapa/chrisleepapa-official/$COMMIT_SHA/automation/threads/todays-word.png" >> "$GITHUB_OUTPUT"
          echo "image_url=https://raw.githubusercontent.com/chrisleepapa/chrisleepapa-official/$COMMIT_SHA/automation/threads/todays-word.png"

      - name: Publish to Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          IMAGE_URL: ${{ steps.media.outputs.image_url }}
        run: |
          set -euo pipefail

          if [ -z "$THREADS_ACCESS_TOKEN" ]; then
            echo "THREADS_ACCESS_TOKEN GitHub Secret is not configured."
            exit 1
          fi

          # Confirm that Meta can fetch a publicly accessible PNG before creating a container.
          IMAGE_CHECK="$(curl -sS -L -o /dev/null -w "%{http_code} %{content_type} %{size_download}" "$IMAGE_URL")"
          echo "Public image check (HTTP, content-type, bytes): $IMAGE_CHECK"
          IMAGE_HTTP="${IMAGE_CHECK%% *}"
          IMAGE_META="${IMAGE_CHECK#* }"
          IMAGE_TYPE="${IMAGE_META%% *}"
          if [ "$IMAGE_HTTP" != "200" ] || [ "$IMAGE_TYPE" != "image/png" ]; then
            echo "Image URL is not publicly serving a PNG. Refusing to call Threads API."
            exit 1
          fi

          # Do not use curl --fail here: it suppresses the API response from the log
          # when command substitution exits under bash -e. Capture and print safe error JSON.
          CREATE_HTTP="$(curl -sS -o /tmp/threads-create-response.json -w "%{http_code}" -X POST "https://graph.threads.net/me/threads" \
            --data-urlencode "access_token=$THREADS_ACCESS_TOKEN" \
            --data-urlencode "media_type=IMAGE" \
            --data-urlencode "image_url=$IMAGE_URL" \
            --data-urlencode "text=오늘의 말씀 📖" \
            --data-urlencode "alt_text=Chris LEE.PAPA 오늘의 말씀")"
          CREATE_RESPONSE="$(cat /tmp/threads-create-response.json)"
          echo "Threads create-container HTTP status: $CREATE_HTTP"
          echo "Threads create-container response: $CREATE_RESPONSE"
          case "$CREATE_HTTP" in
            2??) ;;
            *) echo "Threads rejected the image container request."; exit 1 ;;
          esac

          CONTAINER_ID="$(printf '%s' "$CREATE_RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);if(!j.id)process.exit(1);process.stdout.write(j.id)}catch{process.exit(1)}})")"

          # IMAGE containers are processed asynchronously by Threads.
          for attempt in 1 2 3 4 5; do
            STATUS_HTTP="$(curl -sS -o /tmp/threads-status-response.json -w "%{http_code}" \
              --get "https://graph.threads.net/$CONTAINER_ID" \
              --data-urlencode "fields=status,error_message" \
              --data-urlencode "access_token=$THREADS_ACCESS_TOKEN")"
            STATUS_RESPONSE="$(cat /tmp/threads-status-response.json)"
            echo "Container status attempt $attempt (HTTP $STATUS_HTTP): $STATUS_RESPONSE"
            case "$STATUS_HTTP" in
              2??) ;;
              *) echo "Unable to read Threads container status."; exit 1 ;;
            esac

            STATUS="$(printf '%s' "$STATUS_RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);process.stdout.write(j.status||'')}catch{process.exit(1)}})")"
            if [ "$STATUS" = "FINISHED" ]; then
              break
            fi
            if [ "$STATUS" = "ERROR" ] || [ "$STATUS" = "EXPIRED" ]; then
              echo "Threads container processing failed: $STATUS_RESPONSE"
              exit 1
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Threads container did not reach FINISHED within 5 minutes."
              exit 1
            fi
            sleep 60
          done

          PUBLISH_HTTP="$(curl -sS -o /tmp/threads-publish-response.json -w "%{http_code}" -X POST "https://graph.threads.net/me/threads_publish" \
            --data-urlencode "creation_id=$CONTAINER_ID" \
            --data-urlencode "access_token=$THREADS_ACCESS_TOKEN")"
          PUBLISH_RESPONSE="$(cat /tmp/threads-publish-response.json)"
          echo "Threads publish HTTP status: $PUBLISH_HTTP"
          echo "Threads publish response: $PUBLISH_RESPONSE"
          case "$PUBLISH_HTTP" in
            2??) ;;
            *) echo "Threads failed to publish the media container."; exit 1 ;;
          esac
