name: Update Journal 4 i18n
on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/update-journal4-i18n.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update journal-4.html
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('journal-4.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<meta property="og:image" content="https://chrisleepapa-official.vercel.app/images/og_share.png?v=1">', '<meta property="og:image" content="https://chrisleepapa-official.vercel.app/images/og_share.png?v=1">\n    <meta name="twitter:card" content="summary_large_image">\n    <meta name="twitter:title" content="신앙과 창작이 함께 숨 쉬는 공간, 정식 오픈했습니다 🙏">\n    <meta name="twitter:description" content="찬양, AI 음악, 단편소설, 성경 말씀, 미니게임까지 — Chris LEE.PAPA의 모든 창작물을 한곳에 담은 공식 아카이브가 정식 오픈했습니다.">\n    <meta name="twitter:image" content="https://chrisleepapa-official.vercel.app/images/og_share.png?v=1">')
          replacements = {
            '<a class="back-link" href="/">← Chris\'s Journal 전체 목록으로</a>': '<a class="back-link" href="/" data-i18n="back_link">← Chris\'s Journal 전체 목록으로</a>',
            '<span>2026.08 · 공식 오픈 안내</span>': '<span data-i18n="meta_info">2026.08 · 공식 오픈 안내</span>',
            '<span class="cat">공지 · 사이트 소개</span>': '<span class="cat" data-i18n="category">공지 · 사이트 소개</span>',
            '<h1 class="page-title">신앙과 창작이 함께 숨 쉬는 공간, 정식 오픈했습니다 🙏</h1>': '<h1 class="page-title" data-i18n="title">신앙과 창작이 함께 숨 쉬는 공간, 정식 오픈했습니다 🙏</h1>',
            '<div class="journal-body">': '<div class="journal-body" data-i18n="body">',
            '<span class="note">다음 편 · 캐릭터 디자인과 삽화, 딸들과 함께한 시간</span>': '<span class="note" data-i18n="next_note">다음 편 · 캐릭터 디자인과 삽화, 딸들과 함께한 시간</span>',
            '<span class="cta">전체 아카이브가 궁금하다면 <a href="about">ABOUT</a> 페이지에서 소개를 확인해보세요 →</span>': '<span class="cta"><span data-i18n="archive_cta">전체 아카이브가 궁금하다면</span> <a href="about" data-i18n="about_link">ABOUT</a> <span data-i18n="archive_arrow">페이지에서 소개를 확인해보세요 →</span></span>',
            '<span class="dir">← 이전 글</span>': '<span class="dir" data-i18n="prev_label">← 이전 글</span>',
            '<span class="ttl">나도 작가! POD로 직접 책을 출판하는 법</span>': '<span class="ttl" data-i18n="prev_title">나도 작가! POD로 직접 책을 출판하는 법</span>'
          }
          for a,b in replacements.items():
            s=s.replace(a,b)
          en_body = '''<p>Hello, this is Chris LEE.PAPA. I have finally opened a space where faith and creativity can breathe together. I gathered the creative works I have made along the way — worship music, AI music, short stories, Bible resources, and mini games — into one official archive.</p>
<div class="journal-subhead">🌟 Who is this space for?</div>
<p>If you want to start your day with Scripture, enjoy CCM worship music, are curious about new creations made with AI technology, or simply want to discover something new, I hope you will feel free to explore this space.</p>
<div class="journal-subhead">📖 Today's Bible Word</div>
<p>In the <a href="bible">BIBLE Archive</a>, you can read and reflect on all 1,189 chapters of the Bible online. Highlights, bookmarks, notes, Bible quizzes, and reading progress are included to help you stay connected to Scripture and work toward reading the entire Bible. The verse of the day also changes automatically every morning, with Korean and English versions that you can save as an image or share. A complete Bible reading schedule is available from Genesis to Revelation, so why not take the journey with me, one day at a time?</p>
<div class="journal-subhead">🙌 Worship Albums · My Hymns Vol.1 &amp; Vol.2</div>
<p>The <a href="worship">WORSHIP Archive</a> contains CCM albums filled with sincere confessions of faith. These are songs of worship I created through difficult seasons, and you can listen to them for free on Spotify and YouTube.</p>
<div class="journal-subhead">🎵 Original Music</div>
<p>The <a href="music">MUSIC Archive</a> features original instrumental, pop, and CCM music created with Suno AI. You can listen on Spotify and YouTube, with direct connections from the site.</p>
<div class="journal-subhead">📚 Books · Sister Squad &amp; Miracle Shot</div>
<p>The <a href="book">BOOK Archive</a> brings together original IP born from my two daughters. The fantasy novel <em>Sister Squad</em> was inspired by my daughters Yul and Jung, and you can also discover the futsal fantasy <em>Miracle Shot</em>. The books are currently available through major Korean online bookstores, including Yes24, Kyobo Book Centre, and Youngpoong Bookstore.</p>
<div class="journal-subhead">🎬 AI Short Films &amp; Music Videos</div>
<p>The <a href="movie">MOVIE Archive</a> features short films and music videos created directly with AI video technology. You may find yourself thinking, "Can AI really make videos like this?"</p>
<div class="journal-subhead">🎮 Mini Games · All Free</div>
<p>The <a href="gameinfo">GAME Archive</a> features mini games created with AI technology. They are arcade-style games that are easy to enjoy with children and can be played directly on mobile devices.</p>
<p class="journal-quote">I pray that courage to rise again and miracles will fill your life, even in the darkest moments. — Chris LEE.PAPA</p>'''
          script = '''<script>\nwindow.PAGE_I18N={\nko:{meta_title:"신앙과 창작이 함께 숨 쉬는 공간, 정식 오픈했습니다 🙏 - Chris LEE.PAPA Journal",meta_description:"찬양, AI 음악, 단편소설, 성경 말씀, 미니게임까지 — Chris LEE.PAPA의 모든 창작물을 한곳에 담은 공식 아카이브가 정식 오픈했습니다.",back_link:"← Chris's Journal 전체 목록으로",meta_info:"2026.08 · 공식 오픈 안내",category:"공지 · 사이트 소개",title:"신앙과 창작이 함께 숨 쉬는 공간, 정식 오픈했습니다 🙏",body:KO_BODY,next_note:"다음 편 · 캐릭터 디자인과 삽화, 딸들과 함께한 시간",archive_cta:"전체 아카이브가 궁금하다면",about_link:"ABOUT",archive_arrow:"페이지에서 소개를 확인해보세요 →",prev_label:"← 이전 글",prev_title:"나도 작가! POD로 직접 책을 출판하는 법"},\nen:{meta_title:"A Space Where Faith and Creativity Breathe Together, Now Officially Open 🙏 - Chris LEE.PAPA Journal",meta_description:"From worship music and AI creations to short stories, Bible reading, and mini games — the official Chris LEE.PAPA creative archive is now open.",back_link:"← Back to Chris's Journal",meta_info:"Aug. 2026 · Official Launch",category:"Announcement · Site Introduction",title:"A Space Where Faith and Creativity Breathe Together, Now Officially Open 🙏",body:`EN_BODY`,next_note:"Next · Character Design, Illustrations, and Time with My Daughters",archive_cta:"Want to explore the full archive?",about_link:"ABOUT",archive_arrow:"Discover the story behind it here →",prev_label:"← Previous",prev_title:"How I Published My Own Book Through POD"}\n};\n</script>'''
          # Preserve the existing Korean body as the source value, then use English on language switch.
          ko_body = s[s.index('<div class="journal-body" data-i18n="body">')+len('<div class="journal-body" data-i18n="body">'):s.index('</div><div class="article-footer">')]
          # The original body has nested divs; locate article footer by its class rather than first closing div.
          m = re.search(r'<div class="journal-body" data-i18n="body">(.*?)\n\s*</div>\s*\n\s*<div class="article-footer">', s, re.S)
          if not m:
            raise SystemExit('journal body not found')
          ko_body = m.group(1)
          script = script.replace('KO_BODY', '`'+ko_body.replace('`','\\`')+'`').replace('EN_BODY', en_body.replace('`','\\`'))
          s = re.sub(r'<script>\s*window\.PAGE_I18N=.*?</script>\s*<script src="js/main\.js"></script>', script+'\n<script src="js/main.js"></script>', s, flags=re.S)
          p.write_text(s, encoding='utf-8')
      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/update-journal4-i18n.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add journal-4.html .github/workflows/update-journal4-i18n.yml
          git commit -m 'Update Journal 4 bilingual content and SEO metadata'
          git push