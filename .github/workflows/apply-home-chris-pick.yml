name: Apply Chris's Pick home
on:
  push:
    paths:
      - 'js/home-chris-pick.js'
      - '.github/workflows/apply-home-chris-pick.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inject script
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text(encoding='utf-8')
          tag='<script src="js/home-chris-pick.js" defer></script>'
          if tag not in t:
              marker='<link rel="stylesheet" href="css/common.css">'
              if marker not in t: raise SystemExit('common.css marker not found')
              t=t.replace(marker, marker+'\n    '+tag, 1)
              p.write_text(t, encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply daily Chris Pick home design [skip ci]'
          git push origin HEAD:main
