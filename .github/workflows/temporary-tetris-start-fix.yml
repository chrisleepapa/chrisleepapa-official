name: temporary-tetris-start-fix
on:
  push:
    branches: [develop]
    paths: ['.github/workflows/temporary-tetris-start-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Tetris login-to-start flow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('js/game-auth.js')
          s=p.read_text()
          old='#s-login [id="initialsInput"] + button{display:none!important}'
          new='body:not(:has(#tetris)) #s-login [id="initialsInput"] + button{display:none!important}'
          if old in s:
              s=s.replace(old,new,1)
          marker="        }catch(e){console.error('[game-auth]',e)}"
          insert="""            if (page === 'tetris') {\n                setTimeout(() => {\n                    if (window.CLPAuth && window.CLPAuth.isLoggedIn() && typeof window.enterArena === 'function') {\n                        window.enterArena();\n                    }\n                }, 1200);\n            }\n"""
          if marker in s and 'window.enterArena();' not in s:
              s=s.replace(marker,insert+marker,1)
          p.write_text(s)
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/game-auth.js .github/workflows/temporary-tetris-start-fix.yml
          git rm .github/workflows/temporary-tetris-start-fix.yml
          git commit -m "Fix Tetris login to manual start flow [skip ci]"
          git push
