name: Apply GOAL static guide fix
on:
  push:
    branches: [develop]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('gameinfo.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('<!-- Game 7 -->\n            <a href="switch.html"','<!-- Game 6 -->\n            <a href="switch.html"',1)
          s=s.replace('data-i18n="guide7_heading">⑦ 요정 포포의 여정 — Action / Elemental','data-i18n="guide6_heading">⑥ 요정 포포의 여정 — Action / Elemental',1)
          s=s.replace('data-i18n="guide7_desc">\n                            귀여운 요정 포포가','data-i18n="guide6_desc">\n                            귀여운 요정 포포가',1)
          if '/goal.html' not in s:
              goal='''            <!-- Game 7 -->
            <a href="goal.html" class="game-card game-card-image-mode goal-game-card" aria-label="골이예요 GOAL">
                <div class="card-image-bg bg-goal">
                    <img src="images/goal.png" alt="골이예요 GOAL" loading="lazy">
                </div>
                <div class="card-overlay"></div>
                <div class="game-tag tag-switch">MIRACLE SHOT GAME</div>
                <div class="game-card-content-wrap">
                    <h3 class="game-card-title">골이예요 GOAL</h3>
                    <p class="game-card-desc" style="word-break:keep-all;">MIRACLE SHOT의 네 주인공 중 한 명을 선택해 거대한 점수벽을 향해 슛을 날리고, 맞힌 점수를 누적해 승부를 겨루는 1:1 축구 게임입니다.</p>
                </div>
            </a>
'''
              marker='        </div>\n\n        <!-- ── SEO 게임 상세 설명 섹션 ── -->'
              if marker not in s: raise SystemExit('card marker missing')
              s=s.replace(marker,'\n'+goal+marker,1)
          guide='''                    <div style="padding-bottom:18px; border-bottom:1px solid rgba(255,255,255,0.05);">
                        <h3 style="font-family:'Cinzel',serif; color:#e8d08a; font-size:0.9rem; letter-spacing:1px; margin-bottom:8px;">⑦ 골이예요 — MIRACLE SHOT GAME</h3>
                        <p style="color:#b0acac; font-size:0.88rem; line-height:1.9;">MIRACLE SHOT의 네 주인공 중 한 명을 선택해 거대한 점수벽을 향해 슛을 날리고, 맞힌 점수를 누적해 승부를 겨루는 1:1 축구 게임입니다.</p>
                    </div>'''
          if '⑦ 골이예요 — MIRACLE SHOT GAME' not in s:
              marker2='''                    </div>
                </div>

                <p style="color:#666; font-size:0.82rem; line-height:1.8; margin-top:28px; padding-top:20px; border-top:1px solid rgba(255,255,255,0.05);" data-i18n="guide_footer_note">'''
              if marker2 not in s: raise SystemExit('guide marker missing')
              s=s.replace(marker2,'                    </div>\n'+guide+'\n                </div>\n\n                <p style="color:#666; font-size:0.82rem; line-height:1.8; margin-top:28px; padding-top:20px; border-top:1px solid rgba(255,255,255,0.05);" data-i18n="guide_footer_note">',1)
          s=s.replace("guide7_heading: '⑦ 요정 포포의 여정 — Action / Elemental'","guide6_heading: '⑥ 요정 포포의 여정 — Action / Elemental'",1)
          s=s.replace('guide7_desc: `귀여운 요정 포포가','guide6_desc: `귀여운 요정 포포가',1)
          s=s.replace("guide7_heading: \"⑦ Popo the Fairy's Journey — Action / Elemental\"","guide6_heading: \"⑥ Popo the Fairy's Journey — Action / Elemental\"",1)
          s=s.replace('guide7_desc: `Help the adorable fairy Popo','guide6_desc: `Help the adorable fairy Popo',1)
          p.write_text(s,encoding='utf-8')
          p=Path('css/game-responsive.css'); s=p.read_text(encoding='utf-8'); s=s.replace('content:"⑥ 바둑 EASY"','content:"⑥ 요정 포포의 여정"').replace('content:"⑦ 요정 포포의 여정"','content:"⑦ 골이예요"'); p.write_text(s,encoding='utf-8')
          html=Path('gameinfo.html').read_text(encoding='utf-8')
          assert '7가지 무료 온라인 미니게임' in html and '⑥ 요정 포포의 여정' in html and '⑦ 골이예요' in html and html.count('href="goal.html"')==1
          print('verified')
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add gameinfo.html css/game-responsive.css
          git commit -m 'Apply static GOAL card and guide fix'
          git push origin HEAD:develop
