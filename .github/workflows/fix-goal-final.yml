name: Apply final GOAL guide fix

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, '[auto-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Patch files
        shell: python
        run: |
          from pathlib import Path
          import re

          # game-auth.js: keep only retired Baduk card removal on Game Center.
          # Do NOT remove guide #6 or change the 7-game count.
          p = Path('js/game-auth.js')
          s = p.read_text(encoding='utf-8')
          pattern = r"    if \(page === 'gameinfo'\) \{.*?        return;\n    \}\n    if \(page === 'miracleshot'\)"
          replacement = """    if (page === 'gameinfo') {
          const removeBaduk = () => {
              document.querySelectorAll('a.game-card[href*=\"baduk_easy\"]').forEach(card => card.remove());
          };
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', removeBaduk, {once:true}); else removeBaduk();
          return;
      }
      if (page === 'miracleshot')"""
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('game-auth gameinfo block not found')
          p.write_text(s2, encoding='utf-8')

          # gameinfo.html: make Popo #6 and add GOAL #7 immediately after it.
          p = Path('gameinfo.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('<!-- Game 7 -->\n            <a href=\"switch.html\"', '<!-- Game 6 -->\n            <a href=\"switch.html\"', 1)

          old_switch_end = '''            </a>\n        </div>\n\n        <!-- ── SEO 상세 설명 섹션 시작 ── -->'''
          new_switch_end = '''            </a>\n\n            <!-- Game 7 -->\n            <a href=\"goal.html\" class=\"game-card game-card-image-mode goal-game-card\" aria-label=\"골이예요 GOAL\">\n                <div class=\"card-image-bg bg-goal\">\n                    <img src=\"images/goal.png\" alt=\"골이예요 GOAL\" loading=\"lazy\">\n                </div>\n                <div class=\"card-overlay\"></div>\n                <div class=\"game-tag tag-switch\">MIRACLE SHOT GAME</div>\n                <div class=\"game-card-content-wrap\">\n                    <h3 class=\"game-card-title\">골이예요 GOAL</h3>\n                    <p class=\"game-card-desc\" style=\"word-break:keep-all;\">MIRACLE SHOT의 네 주인공 중 한 명을 선택해 거대한 점수벽을 향해 슛을 날리고, 맞힌 점수를 누적해 승부를 겨루는 1:1 축구 게임입니다.</p>\n                </div>\n            </a>\n        </div>\n\n        <!-- ── SEO 상세 설명 섹션 시작 ── -->'''
          if '/goal.html' not in s:
              if old_switch_end not in s:
                  raise SystemExit('game card end marker not found')
              s = s.replace(old_switch_end, new_switch_end, 1)

          # Guide HTML: Popo becomes #6 and GOAL becomes #7 directly below.
          s = s.replace('data-i18n=\"guide7_heading\">⑦ 요정 포포의 여정 — Action / Elemental', 'data-i18n=\"guide6_heading\">⑥ 요정 포포의 여정 — Action / Elemental', 1)
          s = s.replace('data-i18n=\"guide7_desc\">\n                            귀여운 요정 포포가', 'data-i18n=\"guide6_desc\">\n                            귀여운 요정 포포가', 1)
          s = s.replace('guide7_heading: \'⑦ 요정 포포의 여정 — Action / Elemental\'', 'guide6_heading: \'⑥ 요정 포포의 여정 — Action / Elemental\'', 1)
          s = s.replace('guide7_desc: `귀여운 요정 포포가', 'guide6_desc: `귀여운 요정 포포가', 1)
          s = s.replace('guide7_heading: \"⑦ Popo the Fairy\'s Journey — Action / Elemental\"', 'guide6_heading: \"⑥ Popo the Fairy\'s Journey — Action / Elemental\"', 1)
          s = s.replace('guide7_desc: `Help the adorable fairy Popo', 'guide6_desc: `Help the adorable fairy Popo', 1)

          guide_marker = '''                    <div>\n                        <h3 style=\"font-family:'Cinzel',serif; color:#e8d08a; font-size:0.9rem; letter-spacing:1px; margin-bottom:8px;\" data-i18n=\"guide6_heading\">⑥ 요정 포포의 여정 — Action / Elemental</h3>\n                        <p style=\"color:#b0acac; font-size:0.88rem; line-height:1.9;\" data-i18n=\"guide6_desc\">\n                            귀여운 요정 포포가 하늘에서 떨어지는 얼음, 불 그리핀의 공격을 좌우로 피하고 맛있는 음식을 먹을 수 있게 해주세요!\n                            기회는 세번!\n                        </p>\n                    </div>'''
          goal_guide = '''                    <div style=\"padding-bottom:18px; border-bottom:1px solid rgba(255,255,255,0.05);\">\n                        <h3 style=\"font-family:'Cinzel',serif; color:#e8d08a; font-size:0.9rem; letter-spacing:1px; margin-bottom:8px;\">⑦ 골이예요 — MIRACLE SHOT GAME</h3>\n                        <p style=\"color:#b0acac; font-size:0.88rem; line-height:1.9;\">\n                            MIRACLE SHOT의 네 주인공 중 한 명을 선택해 거대한 점수벽을 향해 슛을 날리고, 맞힌 점수를 누적해 승부를 겨루는 1:1 축구 게임입니다.\n                        </p>\n                    </div>'''
          if '⑦ 골이예요 — MIRACLE SHOT GAME' not in s:
              if guide_marker not in s:
                  raise SystemExit('guide marker not found')
              s = s.replace(guide_marker, guide_marker + '\n' + goal_guide, 1)
          p.write_text(s, encoding='utf-8')

          # Responsive card numbering.
          p = Path('css/game-responsive.css')
          s = p.read_text(encoding='utf-8')
          s = s.replace('content:"⑥ 바둑 EASY"', 'content:"⑥ 요정 포포의 여정"')
          s = s.replace('content:"⑦ 요정 포포의 여정"', 'content:"⑦ 골이예요"')
          p.write_text(s, encoding='utf-8')

      - name: Verify and commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          auth=Path('js/game-auth.js').read_text(encoding='utf-8')
          html=Path('gameinfo.html').read_text(encoding='utf-8')
          css=Path('css/game-responsive.css').read_text(encoding='utf-8')
          assert '7가지 무료 온라인 미니게임' in html
          assert '⑥ 요정 포포의 여정' in html
          assert '⑦ 골이예요' in html
          assert html.count('/goal.html') == 1
          assert '⑦ 요정 포포의 여정' not in html
          assert '⑥ 바둑 EASY' not in css
          assert '⑦ 요정 포포의 여정' not in css
          assert '⑥ 요정 포포의 여정' in css
          assert '⑦ 골이예요' in css
          assert 'page === \'gameinfo\'' in auth
          print('GOAL patch verification passed')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gameinfo.html js/game-auth.js css/game-responsive.css
          git rm .github/workflows/fix-goal-final.yml
          git commit -m "[auto-fix] Finalize GOAL game guide and card"
          git push origin HEAD:develop