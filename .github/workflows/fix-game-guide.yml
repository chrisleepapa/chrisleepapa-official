name: Fix Game Guide

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  fix-guide:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Correct guide 6 and 7 and remove temporary workflow
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('gameinfo.html')
          s = p.read_text(encoding='utf-8')

          pattern = re.compile(
              r'(<div>\s*<h3[^>]*data-i18n="guide7_heading"[^>]*>).*?(</div>\s*</div>\s*\n\s*<p[^>]*data-i18n="guide_footer_note")',
              re.S
          )

          replacement = r'''<div style="padding-bottom:18px; border-bottom:1px solid rgba(255,255,255,0.05);">
                        <h3 style="font-family:'Cinzel',serif; color:#e8d08a; font-size:0.9rem; letter-spacing:1px; margin-bottom:8px;" data-i18n="guide6_heading">⑥ 요정 포포의 여정 — Action / Elemental</h3>
                        <p style="color:#b0acac; font-size:0.88rem; line-height:1.9;" data-i18n="guide6_desc">
                            귀여운 요정 포포가 하늘에서 떨어지는 얼음, 불 그리핀의 공격을 좌우로 피하고 맛있는 음식을 먹을 수 있게 해주세요!
                            기회는 세번!
                        </p>
                    </div>
                    <div>
                        <h3 style="font-family:'Cinzel',serif; color:#e8d08a; font-size:0.9rem; letter-spacing:1px; margin-bottom:8px;" data-i18n="guide7_heading">⑦ 골이예요 GOAL — MIRACLE SHOT GAME</h3>
                        <p style="color:#b0acac; font-size:0.88rem; line-height:1.9;" data-i18n="guide7_desc">
                            MIRACLE SHOT의 네 주인공 중 한 명을 선택해 거대한 점수벽을 향해 슛을 날리고, 맞힌 점수를 누적해 승부를 겨루는 1:1 축구 게임입니다.
                        </p>
                    </div>
                </div>

                <p style="color:#666; font-size:0.82rem; line-height:1.8; margin-top:28px; padding-top:20px; border-top:1px solid rgba(255,255,255,0.05);" data-i18n="guide_footer_note"'''

          new_s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'Expected exactly one outdated guide block, found {n}')
          p.write_text(new_s, encoding='utf-8')
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gameinfo.html
          git rm .github/workflows/fix-game-guide.yml
          git commit -m "fix: restore Game Center guide entries 6 and 7"
          git push origin develop
