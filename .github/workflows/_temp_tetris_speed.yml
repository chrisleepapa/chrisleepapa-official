name: Temporary Tetris Speed Update
on:
  push:
    branches: [develop]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Tetris
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tetris.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('let dropCounter = 0, dropInterval = 1000, lastTime = 0;', 'const BASE_DROP_INTERVAL = 2000;\n    const LINE_SPEED_STEP = 500;\n    const MIN_DROP_INTERVAL = 100;\n    let dropCounter = 0, dropInterval = BASE_DROP_INTERVAL, lastTime = 0;', 1)
          old = '''function getDropIntervalForLevel(level) {
        let speedLv;
        if (level <= 5) speedLv = 1;
        else if (level <= 8) speedLv = 2;
        else if (level <= 10) speedLv = 3;
        else if (level <= 12) speedLv = 4;
        else if (level <= 15) speedLv = 5;
        else speedLv = 5 + (level - 15); 

        if (speedLv === 1) return 1000;
        if (speedLv === 2) return 700;
        if (speedLv === 3) return 450;
        if (speedLv === 4) return 250;
        if (speedLv === 5) return 120;
        return Math.max(20, 120 - (speedLv - 5) * 15); 
    }'''
          new = '''function getDropIntervalForLines(lines) {
        return Math.max(
            MIN_DROP_INTERVAL,
            BASE_DROP_INTERVAL - (lines * LINE_SPEED_STEP)
        );
    }'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '        player.lines += totalCleared;\n        player.level = Math.floor(player.lines / 5) + 1;'
          new = '        player.lines += totalCleared;\n        dropInterval = getDropIntervalForLines(player.lines);\n        player.level = Math.floor(player.lines / 5) + 1;'
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('        dropInterval = getDropIntervalForLevel(1);', '        dropInterval = getDropIntervalForLines(0);', 1)
          p.write_text(s, encoding='utf-8')
          PY
          grep -n "BASE_DROP_INTERVAL\|getDropIntervalForLines\|dropInterval = getDropIntervalForLines" tetris.html
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tetris.html
          git rm .github/workflows/_temp_tetris_speed.yml
          git commit -m "Adjust Tetris speed by cleared lines"
          git push origin develop
