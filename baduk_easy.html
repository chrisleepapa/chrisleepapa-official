<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#030305">
<meta name="description" content="바둑 EASY — Sister Squad와 함께 즐기는 무료 바둑 게임. Chris LEE.PAPA.">
<meta property="og:title" content="바둑 EASY — Chris LEE.PAPA">

<title>바둑 EASY — Chris LEE.PAPA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#030305;--bg2:#0a0a10;--bg3:#111118;--gold:#c9a84c;--gold2:#e8c56d;--text:#e8e0d0;--text2:#a0998a;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;overflow-x:hidden;}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
.z1{position:relative;z-index:1;}

header{background:var(--bg2);border-bottom:1px solid #2a2010;padding:12px 20px;display:flex;align-items:center;gap:10px;position:relative;z-index:10;}
header a{color:var(--gold);text-decoration:none;font-family:'Cinzel',serif;font-size:12px;letter-spacing:1px;opacity:.75;transition:opacity .2s;}
header a:hover{opacity:1;}
header .sep{color:#333;}
header .htitle{font-family:'Cinzel',serif;font-size:14px;color:var(--gold);letter-spacing:3px;}

.screen{display:none;min-height:calc(100vh - 49px);position:relative;z-index:1;}
.screen.active{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px 14px 30px;gap:16px;}

/* TOP5 */
.top5-panel{background:rgba(10,10,16,0.96);border:1px solid #2a2010;border-radius:14px;padding:18px 20px;max-width:420px;width:100%;}
.top5-panel h3{font-family:'Cinzel',serif;color:var(--gold);font-size:13px;letter-spacing:2px;margin-bottom:12px;text-align:center;}
.rank-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #181408;}
.rank-row:last-child{border-bottom:none;}
.rnum{font-size:16px;min-width:28px;text-align:center;}
.rini{font-family:'Cinzel',serif;font-size:15px;color:var(--text);min-width:52px;}
.rwins{font-family:'Cinzel',serif;font-size:14px;color:var(--gold2);margin-left:auto;}
.rwins span{font-size:11px;color:var(--text2);font-family:'Noto Sans KR',sans-serif;font-weight:400;}
.no-data{font-size:12px;color:var(--text2);text-align:center;padding:8px 0;}

/* SETUP BOX */
.sbox{background:rgba(10,10,16,0.96);border:1px solid #2a2010;border-radius:14px;padding:26px 22px;max-width:420px;width:100%;text-align:center;}
.sbox h2{font-family:'Cinzel',serif;color:var(--gold);font-size:20px;letter-spacing:3px;margin-bottom:3px;}
.sub{color:var(--text2);font-size:11px;font-style:italic;margin-bottom:22px;}
.sec{font-size:10px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin:16px 0 10px;}

.ini{background:#06060a;border:1px solid #2a2010;border-radius:8px;color:var(--gold2);font-family:'Cinzel',serif;font-size:22px;letter-spacing:8px;text-align:center;width:132px;padding:10px;outline:none;text-transform:uppercase;}
.ini:focus{border-color:var(--gold);}

.char-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ccard{background:#06060c;border:2px solid #1e1a10;border-radius:12px;padding:14px 10px 10px;cursor:pointer;transition:all .25s;text-align:center;}
.ccard:hover,.ccard.sel{border-color:var(--gold);background:#0e0c18;}
.ccard.sel{box-shadow:0 0 18px rgba(201,168,76,.22);}
.ccard img{width:88px;height:88px;object-fit:contain;display:block;margin:0 auto 6px;}
.cn{font-family:'Cinzel',serif;font-size:13px;color:var(--gold);letter-spacing:1px;}
.cd{font-size:10px;color:var(--text2);margin-top:2px;}

.btn-start{background:linear-gradient(135deg,#c9a84c,#7a5018);border:none;border-radius:8px;color:#000;font-family:'Cinzel',serif;font-size:14px;letter-spacing:2px;padding:14px 0;cursor:pointer;margin-top:20px;width:100%;transition:all .2s;font-weight:700;}
.btn-start:hover:not(:disabled){background:linear-gradient(135deg,#e8c56d,#c9a84c);transform:translateY(-1px);}
.btn-start:disabled{opacity:.35;cursor:not-allowed;}

/* GAME */
#gs{display:none;flex-direction:column;min-height:calc(100vh - 49px);position:relative;z-index:1;}
#gs.active{display:flex;}
.gtop{background:var(--bg2);border-bottom:1px solid #1a1408;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:6px;}
.pinfo{display:flex;align-items:center;gap:7px;}
.pinfo img{width:34px;height:34px;object-fit:contain;border-radius:6px;border:1px solid #2a2010;}
.pemo{font-size:26px;line-height:1;}
.sdot{width:13px;height:13px;border-radius:50%;flex-shrink:0;}
.sdot.bk{background:radial-gradient(circle at 35% 35%,#555,#111);border:1px solid #666;}
.sdot.wh{background:radial-gradient(circle at 35% 35%,#fff,#ccc);border:1px solid #aaa;}
.pname{font-family:'Cinzel',serif;font-size:11px;color:var(--gold);letter-spacing:.5px;}
.pcap{font-size:10px;color:var(--text2);}
.center-info{text-align:center;}
.tbadge{background:#0d0c08;border:1px solid #3a2a08;border-radius:6px;padding:4px 10px;font-size:11px;color:var(--gold);display:inline-block;}
.thinker{display:none;align-items:center;gap:5px;font-size:10px;color:var(--text2);justify-content:center;margin-top:3px;}
.thinker.on{display:flex;}
.td{width:4px;height:4px;border-radius:50%;background:var(--gold);animation:tk .7s infinite;}
.td:nth-child(2){animation-delay:.2s;}.td:nth-child(3){animation-delay:.4s;}
@keyframes tk{0%,100%{opacity:.2;transform:scale(.7);}50%{opacity:1;transform:scale(1.3);}}

.gbody{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 6px;}
#bc{display:block;border-radius:6px;touch-action:none;}
.sbar{display:none;gap:12px;font-size:11px;color:var(--text2);padding:4px 0;}
.sbar span{color:var(--gold2);font-weight:500;}
.gctrl{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;justify-content:center;}
.cb{background:var(--bg3);border:1px solid #2a2010;border-radius:7px;color:var(--text2);font-size:12px;padding:7px 13px;cursor:pointer;transition:all .2s;font-family:'Noto Sans KR',sans-serif;}
.cb:hover{border-color:var(--gold);color:var(--gold);}
.cb.red{border-color:#3a1008;}.cb.red:hover{border-color:#c03020;color:#c03020;}

/* OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);display:none;align-items:center;justify-content:center;z-index:200;}
.overlay.on{display:flex;}
.obox{background:var(--bg2);border:1px solid #3a2810;border-radius:14px;padding:30px 24px;max-width:320px;width:92%;text-align:center;}
.obox .re{font-size:52px;margin-bottom:8px;}
.obox h3{font-family:'Cinzel',serif;color:var(--gold);font-size:18px;letter-spacing:2px;margin-bottom:8px;}
.obox p{color:var(--text2);font-size:13px;line-height:1.75;margin-bottom:16px;white-space:pre-line;}
.reg-msg{font-size:12px;padding:8px;margin-bottom:10px;border-radius:6px;}
.reg-msg.ok{color:var(--gold2);background:#0a0a08;border:1px solid #2a2010;}
.reg-msg.err{color:#c05040;}
.obts{display:flex;gap:8px;flex-direction:column;}
.bg{background:linear-gradient(135deg,#c9a84c,#7a5018);border:none;border-radius:8px;color:#000;font-family:'Cinzel',serif;font-size:13px;letter-spacing:1px;padding:12px;cursor:pointer;font-weight:700;}
.bo{background:transparent;border:1px solid #2a2010;border-radius:8px;color:var(--text2);font-size:12px;padding:10px;cursor:pointer;}
.bo:hover{border-color:var(--gold);color:var(--gold);}

@media(max-width:380px){.ccard img{width:72px;height:72px;}.sbox{padding:20px 14px;}}

/* TIMER */
.timer-bar-wrap{width:100%;max-width:600px;height:6px;background:#1a1408;border-radius:3px;margin:6px 0 2px;overflow:hidden;}
.timer-bar{height:6px;border-radius:3px;transition:width .9s linear, background .5s;}
.timer-bar.ok{background:linear-gradient(90deg,#c9a84c,#e8c56d);}
.timer-bar.warn{background:linear-gradient(90deg,#c06020,#e08030);}
.timer-bar.danger{background:linear-gradient(90deg,#c02010,#e04020);}
.timer-txt{font-size:10px;color:var(--text2);text-align:center;margin-bottom:4px;}
.total-time{font-size:10px;color:var(--text2);text-align:center;padding:2px 0;}

/* REVIEW OVERLAY */
.rev-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;flex-direction:column;align-items:center;z-index:300;}
.rev-overlay.on{display:flex;}
.rev-top{background:var(--bg2);border-bottom:1px solid #2a2010;padding:10px 16px;width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.rev-top h3{font-family:'Cinzel',serif;color:var(--gold);font-size:14px;letter-spacing:1px;}
.rev-info{font-size:12px;color:var(--text2);}
.rev-body{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 6px;}
.rev-ctrl{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center;}
.rev-step{font-family:'Cinzel',serif;font-size:13px;color:var(--gold);min-width:80px;text-align:center;}
</style>
</head>

  <div class="gtop z1">
    <div class="pinfo">
      <img id="char-img" src="" alt="">
      <div>
        <div class="pname" id="pn1">율이</div>
        <div class="pcap">잡은 돌 <span id="cp1">0</span></div>
      </div>
      <div class="sdot bk"></div>
    </div>
    <div class="center-info">
      <div class="tbadge" id="tbadge">흑의 차례</div>
      <div class="thinker" id="thk"><div class="td"></div><div class="td"></div><div class="td"></div><span>생각 중</span></div>
    </div>
    <div class="pinfo" style="flex-direction:row-reverse;text-align:right;">
      <div class="pemo" id="opp-emo">🧚</div>
      <div>
        <div class="pname" id="pn2">?</div>
        <div class="pcap">잡은 돌 <span id="cp2">0</span></div>
      </div>
      <div class="sdot wh"></div>
    </div>
  </div>
  <div class="gbody z1">

    <div class="total-time" id="total-time">총 게임 시간: 00:00</div>
    <div class="timer-bar-wrap"><div class="timer-bar ok" id="timer-bar"></div></div>
    <div class="timer-txt" id="timer-txt">남은 시간: 2:00</div>
    <canvas id="bc"></canvas>
    <div class="sbar" id="sbar">
      집 계산 (코미 6.5): 흑 <span id="sb">-</span> / 백 <span id="sw">-</span>
    </div>
    <div class="gctrl">
      <button class="cb" onclick="doPass()">패스</button>
      <button class="cb" onclick="doHint()">힌트</button>
      <button class="cb" onclick="toggleCount()">집 계산</button>
      <button class="cb red" onclick="doResign()">기권</button>
    </div>
  </div>
</div>


<!-- REVIEW OVERLAY -->
<div class="rev-overlay" id="rev-ov">
  <div class="rev-top">
    <h3>🔍 복기</h3>
    <span class="rev-info" id="rev-info">0 / 0 수</span>
    <button class="bo" style="padding:6px 14px;font-size:12px;" onclick="closeReview()">닫기</button>
  </div>
  <div class="rev-body">
    <canvas id="rev-bc"></canvas>
    <div class="rev-ctrl">
      <button class="cb" onclick="revGo(0)">|◀</button>
      <button class="cb" onclick="revGo(revStep-1)">◀</button>
      <span class="rev-step" id="rev-step-txt">0 / 0</span>
      <button class="cb" onclick="revGo(revStep+1)">▶</button>
      <button class="cb" onclick="revGo(revHistory.length)">▶|</button>
    </div>
  </div>
</div>

<!-- RESULT OVERLAY -->
<div class="overlay" id="rov">
  <div class="obox">
    <div class="re" id="remoj">🏆</div>
    <h3 id="rtit">승리!</h3>
    <p id="rdesc"></p>
    <div id="reg-msg"></div>
    <div class="obts">
      <button class="bg" onclick="rematch()">다시 대국</button>
      <button class="cb" style="padding:10px;" onclick="openReview()">🔍 복기</button>
      <button class="bo" onclick="goSetup()">처음으로</button>
    </div>
  </div>
</div>

function sizeBrd(){

/* ===== DRAW ===== */
function drawBrd(){
  const c=document.getElementById('bc'),ctx=c.getContext('2d'),sz=c.width;
  ctx.fillStyle='#c89832';ctx.fillRect(0,0,sz,sz);
  for(let i=0;i<sz;i+=6){ctx.strokeStyle='rgba(100,55,0,0.055)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(sz,i+4);ctx.stroke();}
  ctx.strokeStyle='rgba(60,30,0,0.45)';ctx.lineWidth=3;ctx.strokeRect(1.5,1.5,sz-3,sz-3);
  ctx.strokeStyle='#6a4000';ctx.lineWidth=.7;
  for(let i=0;i<N;i++){
    const p=boff+i*cs;
    ctx.beginPath();ctx.moveTo(p,boff);ctx.lineTo(p,boff+(N-1)*cs);ctx.stroke();
    ctx.beginPath();ctx.moveTo(boff,p);ctx.lineTo(boff+(N-1)*cs,p);ctx.stroke();
  }
  [3,9,15].forEach(r=>[3,9,15].forEach(c2=>{
    ctx.beginPath();ctx.arc(boff+c2*cs,boff+r*cs,Math.max(2.5,cs*.09),0,Math.PI*2);
    ctx.fillStyle='#4a2800';ctx.fill();
  }));
  const COLS='ABCDEFGHJKLMNOPQRST';
  ctx.fillStyle='rgba(70,35,0,0.6)';
  ctx.font=`${Math.max(8,Math.min(12,cs*.3))}px sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<N;i++){
    const px=boff+i*cs;
    ctx.fillText(COLS[i],px,boff-cs*.55);
    ctx.fillText(COLS[i],px,boff+(N-1)*cs+cs*.55);
    ctx.textAlign='right';ctx.fillText(N-i,boff-cs*.5,boff+i*cs);
    ctx.textAlign='left';ctx.fillText(N-i,boff+(N-1)*cs+cs*.5,boff+i*cs);
    ctx.textAlign='center';
  }
  if(cntMode){
    const terr=calcTerr();
    for(let r=0;r<N;r++)for(let c2=0;c2<N;c2++){
      if(!terr[r][c2])continue;
      const x=boff+c2*cs,y=boff+r*cs,hs=cs*.3;
      ctx.fillStyle=terr[r][c2]===1?'rgba(0,0,0,.35)':'rgba(255,255,255,.4)';
      ctx.fillRect(x-hs,y-hs,hs*2,hs*2);
    }
  }
  if(hint){
    ctx.beginPath();ctx.arc(boff+hint[1]*cs,boff+hint[0]*cs,cs*.4,0,Math.PI*2);
    ctx.fillStyle='rgba(255,210,30,.4)';ctx.fill();
  }
  for(let r=0;r<N;r++)for(let c2=0;c2<N;c2++)if(board[r][c2])drawStone(ctx,r,c2,board[r][c2]);
}

function drawStone(ctx,r,c,col){
  const x=boff+c*cs,y=boff+r*cs,rad=cs*.44;
  ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);
  if(col===1){
    const g=ctx.createRadialGradient(x-rad*.3,y-rad*.35,rad*.05,x,y,rad);
    g.addColorStop(0,'#666');g.addColorStop(1,'#0a0a0a');
    ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=.5;ctx.stroke();
  }else{
    const g=ctx.createRadialGradient(x-rad*.3,y-rad*.35,rad*.05,x,y,rad);
    g.addColorStop(0,'#fff');g.addColorStop(.7,'#e8e0d8');g.addColorStop(1,'#c0b8b0');
    ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.22)';ctx.lineWidth=.6;ctx.stroke();
  }
}

/* ===== LOGIC ===== */
function nbrs(r,c){
  const a=[];
  if(r>0)a.push([r-1,c]);if(r<N-1)a.push([r+1,c]);
  if(c>0)a.push([r,c-1]);if(c<N-1)a.push([r,c+1]);
  return a;
}
function cpB(b){return b.map(r=>[...r]);}
function beq(a,b){if(!a||!b)return false;for(let i=0;i<N;i++)for(let j=0;j<N;j++)if(a[i][j]!==b[i][j])return false;return true;}

function getGrp(b,r,c){
  const col=b[r][c];if(!col)return{cells:[],lib:0};
  const vis=new Set(),q=[[r,c]],libs=new Set();
  while(q.length){
    const[cr,cc]=q.pop(),k=cr*N+cc;
    if(vis.has(k))continue;vis.add(k);
    for(const[nr,nc] of nbrs(cr,cc)){
      if(!b[nr][nc])libs.add(nr*N+nc);
      else if(b[nr][nc]===col&&!vis.has(nr*N+nc))q.push([nr,nc]);
    }
  }
  return{cells:[...vis].map(k=>[Math.floor(k/N),k%N]),lib:libs.size};
}

function tryMove(r,c,col,brd){
  if(brd[r][c])return null;
  const nb2=cpB(brd);nb2[r][c]=col;
  const opp=3-col;let cap=0;
  for(const[nr,nc] of nbrs(r,c)){
    if(nb2[nr][nc]===opp){const g=getGrp(nb2,nr,nc);if(!g.lib){g.cells.forEach(([gr,gc])=>{nb2[gr][gc]=0;});cap+=g.cells.length;}}
  }
  if(!getGrp(nb2,r,c).lib)return null;
  return{brd:nb2,cap};
}

function playMove(r,c,col){
  const res=tryMove(r,c,col,board);
  if(!res)return false;
  if(beq(res.brd,prevBoard))return false;
  prevBoard=cpB(board);
  board=res.brd;
  caps[col-1]+=res.cap;
  document.getElementById(`cp${col}`).textContent=caps[col-1];
  // 기보 기록
  moveHistory.push({r,c,col});
  revHistory.push(cpB(board));
  return true;
}

function bestMove(lv){
  const cands=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!board[r][c]&&tryMove(r,c,2,board))cands.push([r,c]);
  if(!cands.length)return null;
  if(lv===1){
    const cap=cands.filter(([r,c])=>wouldCap(r,c,2));
    if(cap.length&&Math.random()<.45)return rnd(cap);
    return rnd(cands);
  }
  let pool=cands.filter(([r,c])=>nearby(r,c)||ctr(r,c));
  if(!pool.length)pool=cands;
  const n=lv===2?45:lv===3?90:pool.length;
  const sample=[...pool].sort(()=>Math.random()-.5).slice(0,Math.min(n,pool.length));
  let best=null,bs=-1e9;
  sample.forEach(([r,c])=>{const s=scoreM(r,c,2,lv);if(s>bs){bs=s;best=[r,c];}});
  return best;
}
function rnd(a){return a[Math.floor(Math.random()*a.length)];}
function wouldCap(r,c,col){
  const res=tryMove(r,c,col,board);if(!res)return false;
  return nbrs(r,c).some(([nr,nc])=>board[nr][nc]===(3-col)&&!getGrp(res.brd,nr,nc).lib);
}
function nearby(r,c){for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<N&&nc>=0&&nc<N&&board[nr][nc])return true;}return false;}
function ctr(r,c){return Math.abs(r-9)<=5&&Math.abs(c-9)<=5;}
function scoreM(r,c,col,lv){
  const opp=3-col;let s=0;
  const res=tryMove(r,c,col,board);if(!res)return-999;
  const nb2=res.brd;
  nbrs(r,c).forEach(([nr,nc])=>{
    if(board[nr][nc]===opp){const g=getGrp(nb2,nr,nc);if(!g.lib)s+=g.cells.length*18;else if(g.lib===1)s+=4;}
    if(board[nr][nc]===col){const g=getGrp(nb2,nr,nc);if(g.lib>=2)s+=2;}
  });
  s+=getGrp(nb2,r,c).lib*.5;
  if(lv>=3){
    let tv=0;
    [[0,1],[1,0],[0,-1],[-1,0]].forEach(([dr,dc])=>{
      let mine=0,emp=0;
      for(let i=1;i<=4;i++){const nr=r+dr*i,nc=c+dc*i;if(nr<0||nr>=N||nc<0||nc>=N)break;if(!board[nr][nc])emp++;else if(board[nr][nc]===col)mine++;}
      tv+=mine-emp*.4;
    });
    s+=tv*.5;
  }
  if(lv>=2)s+=(9-Math.abs(r-9))/18+(9-Math.abs(c-9))/18;
  s+=Math.random()*(lv===4?.3:lv===3?.8:1.8);
  return s;
}

/* ===== HINT ===== */
function doHint(){if(turn!==1||aiOn||gameOver)return;const mv=bestMove(Math.min(gOpp.lv+1,4));if(mv){hint=mv;drawBrd();}}

/* ===== TERRITORY ===== */
function calcTerr(){
  const terr=Array.from({length:N},()=>Array(N).fill(0));
  const vis=Array.from({length:N},()=>Array(N).fill(false));
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(board[r][c]||vis[r][c])continue;
    const q=[[r,c]],cells=[],borders=new Set();
    while(q.length){
      const[cr,cc]=q.pop();if(vis[cr][cc])continue;vis[cr][cc]=true;cells.push([cr,cc]);
      nbrs(cr,cc).forEach(([nr,nc])=>{if(!board[nr][nc]&&!vis[nr][nc])q.push([nr,nc]);else if(board[nr][nc])borders.add(board[nr][nc]);});
    }
    if(borders.size===1){const ow=[...borders][0];cells.forEach(([cr,cc])=>terr[cr][cc]=ow);}
  }
  return terr;
}
function calcScore(){
  const terr=calcTerr();let bk=caps[0],wh=caps[1]+6.5;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(board[r][c]===1)bk++;else if(board[r][c]===2)wh++;
    if(terr[r][c]===1)bk++;else if(terr[r][c]===2)wh++;
  }
  return{bk,wh};
}
function toggleCount(){
  cntMode=!cntMode;
  if(cntMode){
    const s=calcScore();
    document.getElementById('sbar').style.display='flex';
    document.getElementById('sb').textContent=s.bk.toFixed(1);
    document.getElementById('sw').textContent=s.wh.toFixed(1);
  }else{document.getElementById('sbar').style.display='none';}
  drawBrd();
}

/* ===== END GAME ===== */
function endByPass(){
  const s=calcScore();
  const win=s.bk>s.wh;
  const diff=Math.abs(s.bk-s.wh).toFixed(1);
  showResult(win,`집 계산 (코미 6.5)\n흑 ${s.bk.toFixed(1)} / 백 ${s.wh.toFixed(1)}\n\n${win?`흑이 ${diff}집 차 승리!`:`백이 ${diff}집 차 승리`}`);
}

/* ===== REVIEW ===== */
function openReview(){
  if(!revHistory.length)return;
  revStep=revHistory.length;
  const tot=(N-1)*revCs()+revBoff()*2;
  const rc=document.getElementById('rev-bc');
  rc.width=tot;rc.height=tot;
  document.getElementById('rev-ov').classList.add('on');
  drawRevBoard(revStep);
}
function closeReview(){document.getElementById('rev-ov').classList.remove('on');}
function revCs(){return Math.floor(Math.min(innerWidth-12,innerHeight-160,560)/(N+1));}
function revBoff(){return Math.round(revCs()*.9);}
function revGo(step){
  revStep=Math.max(0,Math.min(revHistory.length,step));
  const rcs=revCs(),rboff=revBoff();
  const tot=(N-1)*rcs+rboff*2;
  const rc=document.getElementById('rev-bc');
  rc.width=tot;rc.height=tot;
  drawRevBoard(revStep);
}
function drawRevBoard(step){
  const rcs=revCs(),rboff=revBoff();
  const rc=document.getElementById('rev-bc'),ctx=rc.getContext('2d'),sz=rc.width;
  // board bg
  ctx.fillStyle='#c89832';ctx.fillRect(0,0,sz,sz);
  for(let i=0;i<sz;i+=6){ctx.strokeStyle='rgba(100,55,0,0.055)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(sz,i+4);ctx.stroke();}
  ctx.strokeStyle='rgba(60,30,0,0.45)';ctx.lineWidth=3;ctx.strokeRect(1.5,1.5,sz-3,sz-3);
  ctx.strokeStyle='#6a4000';ctx.lineWidth=.7;
  for(let i=0;i<N;i++){
    const p=rboff+i*rcs;
    ctx.beginPath();ctx.moveTo(p,rboff);ctx.lineTo(p,rboff+(N-1)*rcs);ctx.stroke();
    ctx.beginPath();ctx.moveTo(rboff,p);ctx.lineTo(rboff+(N-1)*rcs,p);ctx.stroke();
  }
  [3,9,15].forEach(r=>[3,9,15].forEach(c2=>{
    ctx.beginPath();ctx.arc(rboff+c2*rcs,rboff+r*rcs,Math.max(2.5,rcs*.09),0,Math.PI*2);
    ctx.fillStyle='#4a2800';ctx.fill();
  }));
  // stones up to step
  const snap=step>0?revHistory[step-1]:Array.from({length:N},()=>Array(N).fill(0));
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(!snap[r][c])continue;
    const x=rboff+c*rcs,y=rboff+r*rcs,rad=rcs*.44;
    ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);
    if(snap[r][c]===1){
      const g=ctx.createRadialGradient(x-rad*.3,y-rad*.35,rad*.05,x,y,rad);
      g.addColorStop(0,'#666');g.addColorStop(1,'#0a0a0a');
      ctx.fillStyle=g;ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=.5;ctx.stroke();
    }else{
      const g=ctx.createRadialGradient(x-rad*.3,y-rad*.35,rad*.05,x,y,rad);
      g.addColorStop(0,'#fff');g.addColorStop(.7,'#e8e0d8');g.addColorStop(1,'#c0b8b0');
      ctx.fillStyle=g;ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.22)';ctx.lineWidth=.6;ctx.stroke();
    }
  }
  // highlight last move
  if(step>0&&moveHistory[step-1]&&moveHistory[step-1].r>=0){
    const mv=moveHistory[step-1];
    const x=rboff+mv.c*rcs,y=rboff+mv.r*rcs;
    ctx.beginPath();ctx.arc(x,y,rcs*.15,0,Math.PI*2);
    ctx.fillStyle=mv.col===1?'rgba(255,200,50,.9)':'rgba(30,30,30,.7)';
    ctx.fill();
  }
  // step label
  document.getElementById('rev-step-txt').textContent=`${step} / ${revHistory.length}`;
  document.getElementById('rev-info').textContent=`${step} / ${revHistory.length} 수`;
}

window.addEventListener('resize',()=>{
  if(document.getElementById('gs').classList.contains('active')){sizeBrd();drawBrd();}
});
</script>
</body>
