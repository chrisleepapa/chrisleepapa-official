{title:'To Rise',type:'Instrumental',id:'2OSKuof7gooLElmFYvoygK',youtube:'https://youtube.com/playlist?list=OLAK5uy_ndXJukqI1ePIzltvjzIf4Vt2_KQroYszo&si=HTtRpOX2HqtGd0DD',tracks:['To Rise','Morning Breeze','Last Vibrato','Never Stop']},
{title:'영역전개',type:'Album',id:'6rZBdEFTJ5mLwINtn9C8KZ',youtube:'https://youtube.com/playlist?list=OLAK5uy_kEiTfwxIvjPCWweGFa2U0-xykLgQ000EI&si=8fCyOOXfj_mneWZ6',tracks:['영역전개','영역전개_inst']},
{title:'벽력일섬',type:'Album',id:'25T549XyXnmiZhqGn7p4x4',youtube:'https://youtube.com/playlist?list=OLAK5uy_lEWXJuSa8EXqjqnXVHZ5s5_dLw8Nucza8&si=2McCMqkCvnL_0vVp',tracks:['벽력일섬_Hekireki Issen','Rev It Up_kor','Rev It Up_eng','Hekireki Issen_Inst']},

];
const spotify=id=>`https://open.spotify.com/album/${id}`;
const embed=id=>`https://open.spotify.com/embed/album/${id}?utm_source=generator&theme=0`;
const oembed=id=>`https://open.spotify.com/oembed?url=${encodeURIComponent(spotify(id))}`;

function getInitialActiveIndex(){
  const params=new URLSearchParams(window.location.search);
  const requested=params.get('album')||params.get('id');
  if(requested){const index=musicData.findIndex(a=>a.id===requested);if(index>=0)return index}
  const hash=decodeURIComponent((window.location.hash||'').replace(/^#/,'')).trim();
  if(hash){const index=musicData.findIndex(a=>a.id===hash||a.title.toLowerCase().replace(/\s+/g,'-')===hash.toLowerCase());if(index>=0)return index}
  return 0;
}

let active=getInitialActiveIndex();
const coverCache={};

const MUSIC_I18N={
ko:{
music_meta_title:'MUSIC ARCHIVE – Chris LEE.PAPA',
music_meta_description:'Chris LEE.PAPA의 공식 MUSIC ARCHIVE. Spotify와 YouTube에서 발매된 AI 음악, 앨범, EP, 싱글과 다양한 창작 음악을 한곳에서 소개합니다.',
music_meta_description_short:'Chris LEE.PAPA의 AI 음악, 앨범, EP, 싱글과 다양한 창작 음악을 한곳에서 만나보세요.',
music_twitter_description:'Chris LEE.PAPA의 AI 음악과 글로벌 플랫폼 발매 작품을 감상하세요.',

music_spotify_album:'Spotify에서 앨범 듣기 ›',music_youtube_listen:'YouTube에서 듣기 ›',music_albums:'ALBUMS',
music_archive_intro:'Chris LEE.PAPA의 음악 작업과 글로벌 플랫폼 발매 작품을 한 곳에서 소개합니다.',music_track:'TRACK',music_tracks:'TRACKS',music_tracklist_spotify:'Spotify에서 트랙리스트 확인',music_total:'TOTAL',
type_Album:'Album',type_EP:'EP',type_Single:'Single',type_Instrumental:'Instrumental',type_Vocal:'Vocal'
},
en:{
music_meta_title:'MUSIC ARCHIVE – Chris LEE.PAPA',
music_meta_description:'Official MUSIC ARCHIVE of Chris LEE.PAPA. Explore AI-generated music, albums, EPs, singles and creative works released on Spotify and YouTube.',
music_meta_description_short:'Discover Chris LEE.PAPA’s AI music, albums, EPs, singles and creative works in one place.',

type_Album:'Album',type_EP:'EP',type_Single:'Single',type_Instrumental:'Instrumental',type_Vocal:'Vocal'
}
};
window.PAGE_I18N=MUSIC_I18N;

function musicLang(){return document.documentElement.lang==='en'?'en':'ko'}
function musicT(key){return MUSIC_I18N[musicLang()][key]??key}
function musicType(type){return musicT(`type_${type}`)}
function musicTrackLabel(count){return count===1?musicT('music_track'):musicT('music_tracks')}

async function loadCover(album){
  if(coverCache[album.id])return coverCache[album.id];
  try{const r=await fetch(oembed(album.id),{cache:'force-cache'});if(!r.ok)throw new Error('oEmbed failed');const d=await r.json();if(d.thumbnail_url){coverCache[album.id]=d.thumbnail_url;return d.thumbnail_url}}
  catch(e){console.warn('Spotify cover unavailable:',album.title,e)}
  return '';
}

function setImageSource(img,album){
  const url=coverCache[album.id];
  if(url){img.src=url;img.style.visibility='visible'}else{img.removeAttribute('src');img.style.visibility='hidden'}
  img.onerror=()=>{img.removeAttribute('src');img.style.visibility='hidden'};
}

async function hydrateCovers(){await Promise.all(musicData.map(a=>loadCover(a)));renderPlaylist();renderActive()}

function renderPlaylist(){
  const box=document.getElementById('playlist-container');box.innerHTML='';
  musicData.forEach((a,i)=>{
    const count=a.trackCount||a.tracks.length;
    const item=document.createElement('div');item.className='track-item'+(i===active?' active':'');
    item.onclick=()=>{active=i;renderPlaylist();renderActive()};
    const img=document.createElement('img');img.className='track-thumb';img.dataset.albumId=a.id;img.alt=`${a.title} album cover`;img.title=`${a.title} album cover`;setImageSource(img,a);item.appendChild(img);
    const details=document.createElement('div');details.className='track-details';details.innerHTML=`<h4>${a.title}</h4><p>${musicType(a.type)} · ${count} ${musicTrackLabel(count)}</p>`;item.appendChild(details);box.appendChild(item);
  });
}

function renderActive(){
  const a=musicData[active];
  document.getElementById('main-title').textContent=a.title;
  document.getElementById('main-type').textContent=musicType(a.type);
  document.getElementById('main-external-link').href=spotify(a.id);
  const y=document.getElementById('main-youtube-link');y.href=a.youtube;y.hidden=!a.youtube;
  document.getElementById('spotify-container').innerHTML=`<iframe src="${embed(a.id)}" title="${a.title} Spotify player" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>`;
  const cover=coverCache[a.id];document.getElementById('main-cover').style.backgroundImage=cover?`url("${cover}")`:'';
  document.getElementById('main-cover').setAttribute('aria-label',`${a.title} album cover`);
  document.querySelectorAll('.track-item').forEach((el,i)=>el.classList.toggle('active',i===active));
}

function renderArchive(){
  const box=document.getElementById('archive-list');let total=0;box.innerHTML=musicData.map(a=>{
    const count=a.trackCount||a.tracks.length;total+=count;
    const shown=a.tracks.length?`<div class="archive-tracks">${a.tracks.map((t,i)=>`<div class="archive-track"><b>${i+1}</b> ${t}</div>`).join('')}</div>`:`<div class="archive-track">${musicT('music_tracklist_spotify')}</div>`;
    return `<div class="archive-album"><div class="archive-album-title">${a.title} · ${musicType(a.type)} · ${count} ${musicTrackLabel(count)}</div>${shown}</div>`;
  }).join('');
  document.getElementById('archive-total').textContent=`${musicT('music_total')} ${total} ${musicT('music_tracks')}`;
}

function refreshMusicLanguage(){renderPlaylist();renderArchive();renderActive()}

renderPlaylist();renderArchive();renderActive();hydrateCovers();

let lastMusicLang=musicLang();
const musicLangObserver=new MutationObserver(()=>{const next=musicLang();if(next!==lastMusicLang){lastMusicLang=next;refreshMusicLanguage()}});
musicLangObserver.observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
</script>
<script>
(function(){

},

function renderMusicStories(){
 const list=document.getElementById('archive-list');
 const heading=document.querySelector('.archive-box h3');
 if(!list||!heading)return;
 const lang=document.documentElement.lang==='en'?'en':'ko';
 heading.textContent=lang==='en'?'✦ THE STORY BEHIND THE MUSIC':'✦ 앨범에 담긴 이야기';
 list.innerHTML=musicData.map(a=>{
   const story=MUSIC_STORIES[lang][a.title];
   if(!story)return '';
   return `<article class="archive-album"><div class="archive-album-title">${a.title}</div><p class="music-story-text">${story}</p></article>`;
 }).join('');
 const total=document.getElementById('archive-total');
 if(total)total.textContent='';
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',renderMusicStories);else renderMusicStories();
let last=document.documentElement.lang;
new MutationObserver(()=>{const next=document.documentElement.lang;if(next!==last){last=next;renderMusicStories()}}).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
})();
</script>
