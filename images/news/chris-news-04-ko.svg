<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920"><rect width="1080" height="1920" fill="#faf9f6"/><text x="90" y="125" font-family="Arial" font-size="30" font-weight="700" letter-spacing="5" fill="#8b6a19">04 · 과학 / 기술</text><text x="90" y="220" font-family="Arial" font-size="22" letter-spacing="4" fill="#6f6a61">2026년 10월 7일</text><rect x="90" y="270" width="110" height="5" fill="#c9a84c"/><text x="90" y="430" font-family="Noto Serif KR, Arial" font-size="30" fill="#8b6a19">노벨 · 화학</text><foreignObject x="90" y="560" width="900" height="260"><div xmlns="http://www.w3.org/1999/xhtml" style="font:700 68px 'Noto Serif KR',Arial;line-height:1.45;color:#302a20">화학 노벨상,<br/>거울상 분자 연구를 조명</div></foreignObject><foreignObject x="90" y="1040" width="900" height="390"><div xmlns="http://www.w3.org/1999/xhtml" style="font:400 31px 'Noto Sans KR',Arial;line-height:1.75;color:#514d46">2026년 노벨 화학상은 분자의 거울상 구조인 키랄성을 제어하는 연구를 인정했습니다. 이러한 연구는 의약품 개발과 화학 합성에서 원하는 분자를 정밀하게 만드는 데 중요한 의미를 가집니다.</div></foreignObject><line x1="90" y1="1500" x2="990" y2="1500" stroke="#d8d1c4" stroke-width="2"/><text x="90" y="1580" font-family="Arial" font-size="21" font-weight="700" letter-spacing="4" fill="#8b6a19">GLOBAL NEWS · CHRIS'S NEWS</text><text x="90" y="1645" font-family="Arial" font-size="27" fill="#514d46">GUARDIAN · NOBEL PRIZE</text><text x="90" y="1780" font-family="Arial" font-size="24" font-weight="700" fill="#8b6a19">04</text><text x="990" y="1780" text-anchor="end" font-family="Arial" font-size="21" fill="#8b6a19">기사 읽기 →</text></svg>