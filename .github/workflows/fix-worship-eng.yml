name: Fix English Worship Page

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/fix-worship-eng.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1
      - name: Match SHOUT album card to Korean Worship
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('worship_eng.html')
          s = p.read_text(encoding='utf-8')

          # Keep the existing SHOUT artwork and streaming links, but make the
          # English page use the same image-first album-card pattern as /worship.
          s = s.replace(
              '.albums-grid{display:grid;grid-template-columns:1fr;gap:28px}',
              '.albums-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}'
          )
          s = s.replace(
              '.album-card{position:relative;min-height:620px;',
              '.album-card{position:relative;min-height:440px;'
          )
          s = s.replace(
              '.album-title{margin:0 0 12px;color:#fff;font-family:\'Noto Serif\',serif;font-size:1.7rem}',
              '.album-title{margin:0 0 12px;color:#fff;font-family:\'Noto Serif\',serif;font-size:1.45rem}'
          )
          s = s.replace(
              '.album-card{min-height:560px}',
              '.album-card{min-height:420px}'
          )

          # Replace the Spotify embed area with the actual SHOUT cover image.
          # vol3.jpg is present in the develop image tree and is the existing
          # SHOUT artwork used by the worship rebuild tooling.
          cover = '<img class="album-cover" src="images/vol3.jpg" alt="SHOUT English Worship album cover" loading="lazy">'
          s = re.sub(
              r'<div class="cover-frame">.*?</div><div class="album-overlay">',
              cover + '<div class="album-overlay">',
              s,
              count=1,
              flags=re.S
          )

          # Remove the obsolete iframe positioning from this card while keeping
          # the rest of the page and the complete 15-track lyric archive intact.
          s = re.sub(r'\.cover-frame\{.*?\}', '', s, count=1)
          s = re.sub(r'\.cover-frame iframe\{.*?\}', '', s, count=1)
          s = s.replace('.cover-frame{padding:20px 20px 235px}', '')

          p.write_text(s, encoding='utf-8')
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worship_eng.html
          git diff --cached --quiet && exit 0
          git commit -m 'Match SHOUT album card to Korean Worship'
          git push origin HEAD:develop
