name: Patch SISTER SQUAD book section

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace book purchase section
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sistersquad.html')
          s = p.read_text()
          marker_start = "        <!-- =====================================================\n             BOOK PURCHASE\n             ===================================================== -->"
          marker_end = "        <!-- =====================================================\n             SEO / ABOUT\n             ===================================================== -->"
          start = s.index(marker_start)
          end = s.index(marker_end, start)
          replacement = '''        <!-- =====================================================
             GET THE BOOK
             ===================================================== -->

        <section aria-labelledby="book-heading" style="text-align:center; margin:20px 0 100px;">

            <h2 id="book-heading" class="section-title" data-i18n="buy_sec_title">
                GET THE BOOK
            </h2>

            <a
                href="shop.html"
                class="buy-btn btn-paper"
                style="display:inline-block; width:auto; min-width:240px; padding:15px 34px;"
            >
                GET THE BOOK →
            </a>

        </section>


'''
          p.write_text(s[:start] + replacement + s[end:])
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sistersquad.html
          git diff --cached --quiet && exit 0
          git commit -m "Simplify SISTER SQUAD 1 book CTA to SHOP"
          git push
