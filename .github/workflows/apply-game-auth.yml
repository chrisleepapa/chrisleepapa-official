name: Apply shared game authentication

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-game-auth:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Add game-auth.js to game pages only
        shell: bash
        run: |
          set -euo pipefail
          files=(
            game.html
            booktop.html
            tetris.html
            switch.html
            curling.html
            fiveinrow.html
            miracleshot.html
            gameinfo.html
          )

          for file in "${files[@]}"; do
            test -f "$file" || { echo "Missing $file"; exit 1; }
            if grep -q 'src="/js/game-auth.js"' "$file"; then
              echo "Already linked: $file"
              continue
            fi
            python3 - "$file" <<'PY'
import sys
from pathlib import Path

path = Path(sys.argv[1])
text = path.read_text(encoding='utf-8')
marker = '</head>'
if marker not in text.lower():
    raise SystemExit(f'No </head> found in {path}')
idx = text.lower().find(marker)
insert = '    <script src="/js/game-auth.js"></script>\n'
text = text[:idx] + insert + text[idx:]
path.write_text(text, encoding='utf-8')
PY
          done

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.html booktop.html tetris.html switch.html curling.html fiveinrow.html miracleshot.html gameinfo.html
          git rm .github/workflows/apply-game-auth.yml
          git commit -m "Connect shared game authentication to all game pages"
          git push origin main

# Triggered once to safely apply the shared authentication link to all eight game pages.
