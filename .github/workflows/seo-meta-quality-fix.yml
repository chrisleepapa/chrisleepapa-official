name: SEO metadata quality fix
on:
  push:
    paths: ['.seo-meta-quality-trigger']
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Refine journal titles and game descriptions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          BASE='https://chrisleepapa-official.vercel.app'
          fixes={
            'journal-1':('오랫동안 품어온 나만의 이야기, 있으신가요? — Chris LEE.PAPA Journal', '언젠가는 꼭 해봐야지 다짐만 하고 서랍 깊숙이 넣어둔 이야기, 평범한 아빠였던 제가 AI와 두 딸의 손을 잡고 판타지 그림 소설을 완성하기까지의 출발점을 들려드립니다.'),
            'journal-2':('제가 사용한 AI 도구, Skywork로 그림 소설을 만든 과정 — Chris LEE.PAPA Journal', 'AI 창작 도구 Skywork를 활용해 그림 소설을 만들었던 실제 과정을 소개합니다. 아이디어 정리부터 이미지와 이야기 구성까지 창작 과정을 기록합니다.'),
            'journal-3':('나도 작가! POD로 직접 책을 출판하는 법 — Chris LEE.PAPA Journal', '원고와 표지가 완성된 다음, POD 플랫폼을 통해 직접 책을 출판하기까지의 5단계를 실제 경험을 바탕으로 정리한 창작 기록입니다.'),
            'journal-4':('신앙과 창작이 함께 숨 쉬는 공간, 정식 오픈했습니다 🙏 — Chris LEE.PAPA Journal', '찬양, AI 음악, 단편소설, 성경 말씀, 미니게임까지 Chris LEE.PAPA의 창작물을 하나의 Creative Archive로 연결한 사이트의 시작을 소개합니다.'),
            'journal-5':('퇴근 후, 나는 다시 창작자가 된다 — Chris LEE.PAPA Journal', '평범한 직장인, 두 딸의 아빠이자 한 여자의 남편으로 살아가며 출퇴근길과 잠들기 전 휴대폰으로 창작을 이어가는 이야기를 기록합니다.'),
            'journal-6':('나의 찬양에서 드리는 기도 — Chris LEE.PAPA', '나의 찬양 프로젝트를 통해 하나님께 드리는 기도와 고백을 기록한 Creative Journal입니다. 찬양의 의미와 신앙의 여정을 함께 담았습니다.'),
            'booktop':('BOOK STACKING MASTER — Chris LEE.PAPA', '물리 엔진 기반으로 떨어지는 책을 차곡차곡 쌓아 기록에 도전하는 캐주얼 웹게임입니다. 균형과 타이밍을 활용해 더 높은 책탑을 만들어보세요.'),
            'fiveinrow':('DYNAMIC OMOK — Chris LEE.PAPA', '캐릭터와 함께 즐기는 오목 대전 웹게임입니다. 5개의 돌을 먼저 연결하는 기본 규칙에 캐릭터와 게임 연출을 더해 색다른 대전을 즐길 수 있습니다.'),
            'curling':('MAGIC CURLING — Chris LEE.PAPA', 'Fairy, Crown, Family 팀이 등장하는 판타지 콘셉트의 컬링 웹게임입니다. 스톤의 방향과 힘을 조절해 상대보다 좋은 위치를 차지해보세요.'),
            'game':('SISTER SQUAD GAME — Chris LEE.PAPA', 'SISTER SQUAD 세계관의 캐릭터들과 함께 즐기는 7×7 보드형 웹게임입니다. 주사위를 굴리고 캐릭터를 이동하며 판 위의 다양한 이벤트와 대결을 경험합니다.'),
          }
          def esc(s): return s.replace('&','&amp;').replace('"','&quot;').replace('<','&lt;').replace('>','&gt;')
          def replace_meta(t, attr, key, val):
            p=rf'(<meta\s+[^>]*{attr}=["\']{re.escape(key)}["\'][^>]*content=["\'])[^"\']*(["\'])'
            if re.search(p,t,re.I): return re.sub(p,lambda m:m.group(1)+esc(val)+m.group(2),t,count=1,flags=re.I)
            p=rf'(<meta\s+[^>]*content=["\'])[^"\']*(["\'][^>]*{attr}=["\']{re.escape(key)}["\'][^>]*>)'
            return re.sub(p,lambda m:m.group(1)+esc(val)+m.group(2),t,count=1,flags=re.I) if re.search(p,t,re.I) else t
          for slug,(title,desc) in fixes.items():
            p=Path(slug+'.html')
            if not p.exists(): continue
            t=p.read_text(encoding='utf-8')
            t=re.sub(r'<title[^>]*>.*?</title>',f'<title>{esc(title)}</title>',t,count=1,flags=re.I|re.S)
            t=replace_meta(t,'name','description',desc)
            t=replace_meta(t,'property','og:title',title)
            t=replace_meta(t,'property','og:description',desc)
            t=replace_meta(t,'name','twitter:title',title)
            t=replace_meta(t,'name','twitter:description',desc)
            p.write_text(t,encoding='utf-8')
          print('Refined',len(fixes),'pages.')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add journal-1.html journal-2.html journal-3.html journal-4.html journal-5.html journal-6.html booktop.html fiveinrow.html curling.html game.html
          git diff --cached --quiet || git commit -m 'Refine page-specific SEO metadata'
          git push
      - name: Remove one-time files
        run: |
          git rm -f .github/workflows/seo-meta-quality-fix.yml .seo-meta-quality-trigger 2>/dev/null || true
          git diff --cached --quiet || (git commit -m 'Remove one-time SEO quality workflow' && git push)
