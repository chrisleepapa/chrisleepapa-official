name: Patch Movie notes loader
on:
  push:
    branches: [develop]
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip movie patch]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Add Movie notes loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('movie.html')
          s = p.read_text(encoding='utf-8')
          tag = '    <script src="js/movie-notes-switch.js"></script>'
          if tag not in s:
              marker = '    <script src="js/main.js"></script>'
              if marker not in s:
                  raise SystemExit('main.js marker not found')
              s = s.replace(marker, tag + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add movie.html
          git diff --cached --quiet && exit 0
          git commit -m 'Load dynamic Movie creation notes [skip movie patch]'
          git push origin HEAD:develop
