        :root{--today-gold:#c9a84c;--today-bg:#030305}body{background:var(--today-bg);color:#eee;min-height:100vh;padding-top:100px;padding-bottom:60px}.today-wrap{width:min(1100px,92vw);margin:0 auto}.today-hero{text-align:center;padding:35px 0}.today-kicker{font:600 .68rem 'Cinzel',serif;letter-spacing:.35em;color:var(--today-gold);margin-bottom:14px}.today-title{font:600 clamp(2.6rem,8vw,5.5rem) 'Cormorant Garamond',serif;letter-spacing:.08em;color:#f3e6bd}.today-date{margin-top:8px;color:rgba(238,238,238,.48);font:.9rem 'Noto Sans KR',sans-serif}.today-profile{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 25px;flex-wrap:wrap}.profile-pill{border:1px solid rgba(201,168,76,.3);border-radius:999px;padding:8px 14px;color:#e8d08a;font:.78rem 'Noto Sans KR',sans-serif;background:rgba(201,168,76,.06)}.profile-btn{border:1px solid rgba(201,168,76,.35);border-radius:999px;padding:8px 13px;color:#c9a84c;background:transparent;cursor:pointer;font:.72rem 'Cinzel',serif;letter-spacing:.08em}.today-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.today-card{background:linear-gradient(145deg,rgba(18,16,14,.96),rgba(8,8,11,.96));border:1px solid rgba(201,168,76,.18);border-radius:20px;padding:26px;box-shadow:0 18px 50px rgba(0,0,0,.25)}.today-card.featured{border-color:rgba(201,168,76,.4)}.today-card h2{font:600 1rem 'Cinzel',serif;letter-spacing:.12em;color:var(--today-gold);margin-bottom:18px}.verse{font:500 1.15rem/1.8 'Noto Sans KR',sans-serif;color:#f2eee5}.verse-ref{display:block;margin-top:14px;color:rgba(201,168,76,.8);font:600 .78rem 'Cinzel',serif;letter-spacing:.08em}.today-form{display:flex;gap:8px;margin-bottom:14px}.today-form input,.today-card textarea,.auth-input{width:100%;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.12);border-radius:10px;color:#eee;padding:11px 12px;outline:none;box-sizing:border-box}.today-form input:focus,.today-card textarea:focus,.auth-input:focus{border-color:rgba(201,168,76,.55)}.today-btn,.auth-submit{border:1px solid rgba(201,168,76,.4);border-radius:10px;padding:0 15px;color:var(--today-gold);background:transparent;cursor:pointer;white-space:nowrap}.today-btn:hover,.auth-submit:hover{background:rgba(201,168,76,.1)}.todo-list{display:flex;flex-direction:column;gap:8px}.todo-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.06);font:.92rem 'Noto Sans KR',sans-serif}.todo-item input{accent-color:var(--today-gold)}.todo-item.done span{text-decoration:line-through;opacity:.35}.empty{color:rgba(238,238,238,.35);font:.85rem 'Noto Sans KR',sans-serif;padding:5px 0}.today-footer{text-align:center;margin-top:35px;color:rgba(238,238,238,.32);font:.78rem 'Noto Sans KR',sans-serif}.today-link{display:inline-block;margin-top:18px;color:var(--today-gold);font:600 .7rem 'Cinzel',serif;letter-spacing:.12em}.auth-overlay{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.82);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:20px}.auth-box{width:min(420px,92vw);background:#0a0a0f;border:1px solid rgba(201,168,76,.45);border-radius:22px;padding:30px;box-shadow:0 30px 80px #000}.auth-box h2{text-align:center;color:#e8d08a;font:600 1.3rem 'Cinzel',serif;letter-spacing:.1em;margin:0 0 8px}.auth-box p{text-align:center;color:#888;font:.82rem 'Noto Sans KR',sans-serif;line-height:1.7;margin:0 0 22px}.auth-input{text-align:center;margin-bottom:12px}.pin-input{letter-spacing:8px;font-weight:bold}.auth-submit{width:100%;height:46px;margin-top:5px}.auth-note{text-align:center!important;margin:15px 0 0!important;font-size:.72rem!important;color:#666!important}.auth-error{color:#e89b8a;text-align:center;min-height:20px;font:.75rem 'Noto Sans KR',sans-serif;margin:7px 0}@media(max-width:700px){.today-grid{grid-template-columns:1fr}body{padding-top:82px;padding-bottom:90px}.today-card{padding:21px}.auth-box{padding:25px}}

<body>
<div id="site-nav"></div>
<div class="auth-overlay" id="todayAuth" aria-hidden="false"><div class="auth-box"><h2 data-i18n="today_auth_title">YOUR TODAY</h2><p data-i18n="today_auth_desc">사이트 공통 계정으로 로그인하면<br>나만의 오늘 기록을 저장할 수 있습니다.</p><input class="auth-input" id="authInitials" maxlength="3" autocomplete="username" placeholder="INITIALS (예: CLP)"><input class="auth-input pin-input" id="authPin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="4자리 PIN"><div class="auth-error" id="authError"></div><button class="auth-submit" id="authSubmit" type="button" data-i18n="today_login">LOGIN / CREATE</button><p class="auth-note" data-i18n="today_auth_note">한 번 로그인하면 성경 등 로그인 필요한 메뉴에서도 같은 계정을 사용합니다.</p></div></div>
<main class="today-wrap" id="todayApp" hidden><header class="today-hero"><div class="today-kicker" data-i18n="today_kicker">YOUR DAILY ARCHIVE</div><h1 class="today-title" data-i18n="today_title">TODAY</h1><div class="today-date" id="todayDate"></div><div class="today-profile"><span class="profile-pill">👤 <strong id="profileInitials"></strong></span><button class="profile-btn" id="logoutBtn" type="button" data-i18n="today_logout">LOG OUT</button></div></header><section class="today-grid"><article class="today-card featured"><h2 data-i18n="today_word">📖 TODAY'S WORD</h2><p class="verse" id="todayVerse"></p><span class="verse-ref" id="todayRef"></span><a class="today-link" href="/bible" data-i18n="today_read_bible">READ BIBLE →</a></article><article class="today-card"><h2 data-i18n="today_tasks">✅ TODAY'S TASKS</h2><form class="today-form" id="todoForm"><input id="todoInput" type="text" maxlength="120" autocomplete="off"><button class="today-btn" type="submit" data-i18n="today_add">ADD</button></form><div class="todo-list" id="todoList"></div></article><article class="today-card"><h2 data-i18n="today_memo_title">📝 TODAY'S MEMO</h2><textarea id="todayMemo" rows="7" maxlength="3000"></textarea></article><article class="today-card"><h2 data-i18n="today_prayer_title">🙏 TODAY'S PRAYER</h2><textarea id="todayPrayer" rows="7" maxlength="3000"></textarea></article></section><div class="today-footer" data-i18n="today_footer">TODAY 기록은 로그인한 이니셜별로 이 브라우저에 분리 저장됩니다.</div></main>
<div id="site-footer"></div>
<script src="js/auth.js"></script>
<script src="js/today-archive-v2.js" defer></script>
<script>
window.PAGE_I18N={
ko:{today_auth_title:'YOUR TODAY',today_auth_desc:'사이트 공통 계정으로 로그인하면<br>나만의 오늘 기록을 저장할 수 있습니다.',today_login:'LOGIN / CREATE',today_auth_note:'한 번 로그인하면 성경 등 로그인 필요한 메뉴에서도 같은 계정을 사용합니다.',today_kicker:'YOUR DAILY ARCHIVE',today_title:'TODAY',today_logout:'LOG OUT',today_word:'📖 TODAY’S WORD',today_read_bible:'READ BIBLE →',today_tasks:'✅ TODAY’S TASKS',today_add:'ADD',today_memo_title:'📝 TODAY’S MEMO',today_prayer_title:'🙏 TODAY’S PRAYER',today_footer:'TODAY 기록은 로그인한 이니셜별로 이 브라우저에 분리 저장됩니다.',todo_placeholder:'오늘 할 일을 적어보세요',memo_placeholder:'오늘 기억하고 싶은 생각을 적어보세요.',prayer_placeholder:'오늘 하나님께 드리고 싶은 기도를 적어보세요.',empty_todo:'아직 등록한 할 일이 없습니다.',today_date_locale:'ko-KR'},
en:{today_auth_title:'YOUR TODAY',today_auth_desc:'Log in with your site account to save<br>your personal daily records.',today_login:'LOGIN / CREATE',today_auth_note:'The same account is used across Bible and other members-only areas.',today_kicker:'YOUR DAILY ARCHIVE',today_title:'TODAY',today_logout:'LOG OUT',today_word:'📖 TODAY’S WORD',today_read_bible:'READ BIBLE →',today_tasks:'✅ TODAY’S TASKS',today_add:'ADD',today_memo_title:'📝 TODAY’S MEMO',today_prayer_title:'🙏 TODAY’S PRAYER',today_footer:'TODAY records are stored separately in this browser for each logged-in account.',todo_placeholder:'Write a task for today',memo_placeholder:'Write something you want to remember today.',prayer_placeholder:'Write a prayer to God today.',empty_todo:'No tasks yet.',today_date_locale:'en-US'}
};
const verses=[['내가 너와 함께 함이라 내가 너를 굳세게 하리라 참으로 내가 너를 도와주리라','이사야 41:10','I am with you and will strengthen you; I will help you.','Isaiah 41:10'],['여호와는 나의 목자시니 내게 부족함이 없으리로다','시편 23:1','The Lord is my shepherd; I shall not want.','Psalm 23:1'],['내게 능력 주시는 자 안에서 내가 모든 것을 할 수 있느니라','빌립보서 4:13','I can do all things through Christ who strengthens me.','Philippians 4:13'],['너의 길을 여호와께 맡기라 그를 의지하면 그가 이루시고','시편 37:5','Commit your way to the Lord; trust in him and he will act.','Psalm 37:5'],['아무 것도 염려하지 말고 다만 모든 일에 기도와 간구로 너희 구할 것을 하나님께 아뢰라','빌립보서 4:6','Do not be anxious, but in everything, by prayer and petition, present your requests to God.','Philippians 4:6']];
const day=Math.floor(Date.now()/86400000),verse=verses[day%verses.length];
const getJSON=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}},put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let profile='';
function profileKey(){return 'chrisleepapa-today-'+profile+'-'+new Date().toISOString().slice(0,10)}
function updateTodayLanguage(lang){const d=window.PAGE_I18N[lang]||window.PAGE_I18N.ko;document.getElementById('todayDate').textContent=new Intl.DateTimeFormat(d.today_date_locale,{dateStyle:'full'}).format(new Date());document.getElementById('todayVerse').textContent='“'+(lang==='en'?verse[2]:verse[0])+'”';document.getElementById('todayRef').textContent=lang==='en'?verse[3]:verse[1];document.getElementById('todoInput').placeholder=d.todo_placeholder;document.getElementById('todayMemo').placeholder=d.memo_placeholder;document.getElementById('todayPrayer').placeholder=d.prayer_placeholder;document.getElementById('todayAuth').querySelector('#authInitials').placeholder=lang==='en'?'INITIALS (e.g. CLP)':'INITIALS (예: CLP)';document.getElementById('todayAuth').querySelector('#authPin').placeholder=lang==='en'?'4-DIGIT PIN':'4자리 PIN';renderTodos&&renderTodos()}
function startToday(){document.getElementById('todayAuth').style.display='none';document.getElementById('todayAuth').setAttribute('aria-hidden','true');document.getElementById('todayApp').hidden=false;document.getElementById('profileInitials').textContent=profile;loadData();updateTodayLanguage(window.getCurrentLang?window.getCurrentLang():'ko')}
async function login(){const ini=document.getElementById('authInitials').value.trim().toUpperCase();const pin=document.getElementById('authPin').value.trim();const err=document.getElementById('authError');err.textContent='';const result=await window.CLPAuth.login(ini,pin,true);if(!result.ok){err.textContent=result.error;return}profile=result.user.initials;startToday()}
let renderTodos=()=>{};
function loadData(){const k=profileKey(),data=getJSON(k,{todos:[],memo:'',prayer:''});let todos=data.todos||[];const list=document.getElementById('todoList');const save=()=>put(k,{todos,memo:document.getElementById('todayMemo').value,prayer:document.getElementById('todayPrayer').value});renderTodos=()=>{const d=window.PAGE_I18N[window.getCurrentLang?window.getCurrentLang():'ko']||window.PAGE_I18N.ko;list.innerHTML='';if(!todos.length){list.innerHTML='<div class="empty">'+d.empty_todo+'</div>';return}todos.forEach((x,i)=>{const row=document.createElement('label');row.className='todo-item'+(x.done?' done':'');const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!x.done;cb.onchange=()=>{todos[i].done=cb.checked;save();renderTodos()};const s=document.createElement('span');s.textContent=x.text;row.append(cb,s);list.appendChild(row)})};document.getElementById('todayMemo').value=data.memo||'';document.getElementById('todayPrayer').value=data.prayer||'';document.getElementById('todoForm').onsubmit=e=>{e.preventDefault();const input=document.getElementById('todoInput'),text=input.value.trim();if(!text)return;todos.push({text,done:false});input.value='';save();renderTodos()};document.getElementById('todayMemo').oninput=save;document.getElementById('todayPrayer').oninput=save;renderTodos()}
document.getElementById('authSubmit').onclick=login;document.getElementById('authPin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});document.getElementById('logoutBtn').onclick=()=>{window.CLPAuth.logout();location.reload()};window.onLangChange=updateTodayLanguage;
const saved=window.CLPAuth.getUser();if(saved){profile=saved.initials;startToday()}
</script>
<script src="js/main.js"></script>
