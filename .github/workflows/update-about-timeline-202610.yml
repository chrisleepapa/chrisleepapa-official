name: Update About Timeline 202610

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message != 'Remove temporary 202610 timeline workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update timeline
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('about.html')
          s = p.read_text(encoding='utf-8')
          old = '''      <!-- 2026.09 -->
      <article class="timeline-item">
          <div class="timeline-year">2026.09</div>
          <div class="timeline-content">
              <strong data-i18n="time8_title">CREATIVE ARCHIVE REBUILT</strong>
              <p data-i18n="time8_desc">Creative Archive를 전면 업데이트하고, SISTER SQUAD 1 영문판 제작 및 유통을 준비하고 있습니다. J-POP 음악 제작과 론칭도 준비하고 있습니다.</p>
          </div>
      </article>'''
          new = old + '''

      <!-- 2026.10 -->
      <article class="timeline-item">
          <div class="timeline-year">2026.10</div>
          <div class="timeline-content">
              <strong data-i18n="time9_title">VIDEO PRODUCTION</strong>
              <p data-i18n="time9_desc">SISTER SQUAD 2 홍보 영상<br>기타 AI 활용 영상</p>
          </div>
      </article>'''
          if old not in s:
              raise SystemExit('2026.09 timeline block not found')
          if 'data-i18n="time9_title"' in s:
              raise SystemExit('2026.10 timeline already exists')
          s = s.replace(old, new, 1)
          old_ko = '''        time8_title: "CREATIVE ARCHIVE REBUILT",
        time8_desc: "Creative Archive를 전면 업데이트하고, SISTER SQUAD 1 영문판 제작 및 유통을 준비하고 있습니다. J-POP 음악 제작과 론칭도 준비하고 있습니다.",'''
          new_ko = '''        time8_title: "CREATIVE ARCHIVE REBUILT",
        time8_desc: "Creative Archive를 전면 업데이트하고 있습니다.<br>SISTER SQUAD 1 영문판 제작 및 유통을 준비하고 있습니다.<br>J-POP 음악 제작 및 론칭 완료.",
        time9_title: "VIDEO PRODUCTION",
        time9_desc: "SISTER SQUAD 2 홍보 영상<br>기타 AI 활용 영상",'''
          if old_ko not in s:
              raise SystemExit('Korean time8 i18n block not found')
          s = s.replace(old_ko, new_ko, 1)
          old_en = '''        time8_title: "CREATIVE ARCHIVE REBUILT",
        time8_desc: "I am fully updating the Creative Archive, preparing the English edition of SISTER SQUAD 1 for production and distribution, and preparing for J-POP music production and launch.",'''
          new_en = '''        time8_title: "CREATIVE ARCHIVE REBUILT",
        time8_desc: "Fully updating the Creative Archive.<br>Preparing the English edition of SISTER SQUAD 1 for production and distribution.<br>J-POP music production and launch completed.",
        time9_title: "VIDEO PRODUCTION",
        time9_desc: "SISTER SQUAD 2 promotional video<br>Other AI-powered video projects",'''
          if old_en not in s:
              raise SystemExit('English time8 i18n block not found')
          s = s.replace(old_en, new_en, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html
          git diff --cached --quiet && exit 0
          git commit -m "Add October 2026 About Timeline entry"
          git push