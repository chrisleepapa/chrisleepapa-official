name: Apply GOAL game card

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply GOAL game card and remove patcher') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
      - name: Patch gameinfo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('gameinfo.html')
          s = p.read_text(encoding='utf-8')
          if 'data-goal-game-card="true"' not in s:
              card = '''\n<a href="/goal.html" class="game-card" data-goal-game-card="true" aria-label="골이예요 GOAL">\n  <div class="game-card-image" style="background-image:url('/images/goal.png');background-size:cover;background-position:center;">\n    <img src="/images/goal.png" alt="골이예요 GOAL" loading="lazy" style="width:100%;height:100%;object-fit:cover;display:block;">\n  </div>\n  <div class="game-card-content">\n    <span class="game-card-tag">MIRACLE SHOT GAME</span>\n    <h3 class="game-card-title">골이예요 <span>GOAL</span></h3>\n    <p class="game-card-desc">MIRACLE SHOT의 네 주인공 중 한 명을 선택해 거대한 점수벽을 향해 슛을 날려 최고의 점수를 노리는 축구 게임입니다.</p>\n  </div>\n</a>\n'''
              matches = list(re.finditer(r'<a\\b[^>]*class=["\'][^"\']*game-card[^"\']*["\'][^>]*>.*?</a>', s, re.S | re.I))
              if not matches:
                  raise SystemExit('No game-card anchor found')
              m = matches[-1]
              s = s[:m.end()] + card + s[m.end():]
              p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/apply-goal-gameinfo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gameinfo.html .github/workflows/apply-goal-gameinfo.yml
          git commit -m "Apply GOAL game card and remove patcher" || exit 0
          git push origin develop
