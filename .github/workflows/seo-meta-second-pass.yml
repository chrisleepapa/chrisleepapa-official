name: SEO metadata second pass

on:
  workflow_dispatch:
  push:
    paths:
      - '.seo-meta-second-pass-trigger'

jobs:
  normalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalize HTML metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          BASE = 'https://chrisleepapa-official.vercel.app'
          files = sorted(Path('.').glob('*.html'))

          titles = {
              'index': 'Chris LEE.PAPA — The Creative Archive',
              'today': 'TODAY — Chris LEE.PAPA',
              'about': 'ABOUT — Chris LEE.PAPA',
              'music': 'MUSIC ARCHIVE — Chris LEE.PAPA',
              'movie': 'MOVIE ARCHIVE — Chris LEE.PAPA',
              'worship': 'WORSHIP — 나의 찬양 | Chris LEE.PAPA',
              'worship_eng': 'ENGLISH WORSHIP — SHOUT | Chris LEE.PAPA',
              'shout': 'SHOUT — English Worship | Chris LEE.PAPA',
              'sistersquad-hub': 'SISTER SQUAD — 놀라운 자매들 | Chris LEE.PAPA',
              'sistersquad': 'SISTER SQUAD 1 — 놀라운 자매들 | Chris LEE.PAPA',
              'sistersquad2': 'SISTER SQUAD 2 — The Adventure Continues | Chris LEE.PAPA',
              'world-lore': 'SISTER SQUAD WORLD LORE | Chris LEE.PAPA',
              'miracleshot': 'MIRACLE SHOT — Chris LEE.PAPA',
              'bible': 'BIBLE — Chris LEE.PAPA',
              'gameinfo': 'GAME CENTER — Chris LEE.PAPA',
              'game': 'SISTER SQUAD GAME — Chris LEE.PAPA',
              'booktop': 'BOOK STACKING MASTER — Chris LEE.PAPA',
              'fiveinrow': 'DYNAMIC OMOK — Chris LEE.PAPA',
              'curling': 'MAGIC CURLING — Chris LEE.PAPA',
              'tetris': 'TETRIS — Chris LEE.PAPA',
              'switch': 'SWITCH — Chris LEE.PAPA',
              'journal': 'JOURNAL — Chris LEE.PAPA',
              'journal-1': 'Journal 1 — Chris LEE.PAPA',
              'journal-2': 'Journal 2 — Chris LEE.PAPA',
              'journal-3': 'Journal 3 — Chris LEE.PAPA',
              'journal-4': 'Journal 4 — Chris LEE.PAPA',
              'journal-5': 'Journal 5 — Chris LEE.PAPA',
              'journal-6': '나의 찬양에서 드리는 기도 — Chris LEE.PAPA',
              'yul': '율이 (Yul) Profile — SisterSquad | Chris LEE.PAPA',
              'jung': '정 (Jung) Profile — SisterSquad | Chris LEE.PAPA',
              'guestbook': 'Guestbook — Chris LEE.PAPA',
              'contact': 'CONTACT — Chris LEE.PAPA',
              'shop': 'SHOP — Chris LEE.PAPA',
              'privacy': '개인정보처리방침 — Chris LEE.PAPA',
              'terms': '이용약관 — Chris LEE.PAPA',
          }

          descriptions = {
              'today': 'Chris LEE.PAPA의 TODAY 페이지. 오늘의 성경말씀과 할 일, 메모, 기도를 한곳에서 기록하고 관리하는 개인용 데일리 아카이브입니다.',
          }

          def esc(s):
              return s.replace('&','&amp;').replace('"','&quot;').replace('<','&lt;').replace('>','&gt;')

          def get(pattern, text):
              m = re.search(pattern, text, re.I | re.S)
              return m.group(1).strip() if m else ''

          def replace_meta(text, attr, key, value):
              pat = rf'(<meta\s+[^>]*{attr}=["\']{re.escape(key)}["\'][^>]*content=["\'])[^"\']*(["\'])'
              if re.search(pat, text, re.I):
                  return re.sub(pat, lambda m: m.group(1)+esc(value)+m.group(2), text, count=1, flags=re.I)
              pat2 = rf'(<meta\s+[^>]*content=["\'])[^"\']*(["\'][^>]*{attr}=["\']{re.escape(key)}["\'][^>]*>)'
              if re.search(pat2, text, re.I):
                  return re.sub(pat2, lambda m: m.group(1)+esc(value)+m.group(2), text, count=1, flags=re.I)
              return text

          def has_meta(text, attr, key):
              return bool(re.search(rf'<meta\s+[^>]*{attr}=["\']{re.escape(key)}["\']', text, re.I))

          def add_meta(text, tag):
              head = re.search(r'</head>', text, re.I)
              return text[:head.start()] + '  ' + tag + '\n' + text[head.start():] if head else text

          for p in files:
              slug = p.stem
              text = p.read_text(encoding='utf-8')
              title = titles.get(slug)
              if not title:
                  title = get(r'<title[^>]*>(.*?)</title>', text) or f'{slug} — Chris LEE.PAPA'
                  if 'Chris LEE.PAPA' not in title:
                      title += ' — Chris LEE.PAPA'

              desc = descriptions.get(slug) or get(r'<meta\s+[^>]*name=["\']description["\'][^>]*content=["\'](.*?)["\']', text)
              if not desc:
                  desc = f'{title}. Chris LEE.PAPA의 The Creative Archive 콘텐츠 페이지입니다.'

              # Title is authoritative; keep page-specific titles already defined above.
              if not re.search(r'<title[^>]*>', text, re.I):
                  text = re.sub(r'</head>', f'  <title>{esc(title)}</title>\n</head>', text, count=1, flags=re.I)
              else:
                  text = re.sub(r'<title[^>]*>.*?</title>', f'<title>{esc(title)}</title>', text, count=1, flags=re.I|re.S)

              # Ensure the core SEO signals exist.
              if has_meta(text, 'name', 'description'):
                  text = replace_meta(text, 'name', 'description', desc)
              else:
                  text = add_meta(text, f'<meta name="description" content="{esc(desc)}">')

              if has_meta(text, 'name', 'robots'):
                  text = replace_meta(text, 'name', 'robots', 'index, follow')
              else:
                  text = add_meta(text, '<meta name="robots" content="index, follow">')

              canonical = f'{BASE}/' if slug == 'index' else f'{BASE}/{slug}'
              if re.search(r'<link\s+[^>]*rel=["\']canonical["\'][^>]*>', text, re.I):
                  text = re.sub(r'<link\s+[^>]*rel=["\']canonical["\'][^>]*>', f'<link rel="canonical" href="{canonical}">', text, count=1, flags=re.I)
              else:
                  text = add_meta(text, f'<link rel="canonical" href="{canonical}">')

              # Open Graph: always present and synchronized with the page identity.
              if has_meta(text, 'property', 'og:title'):
                  text = replace_meta(text, 'property', 'og:title', title)
              else:
                  text = add_meta(text, f'<meta property="og:title" content="{esc(title)}">')
              if has_meta(text, 'property', 'og:description'):
                  text = replace_meta(text, 'property', 'og:description', desc)
              else:
                  text = add_meta(text, f'<meta property="og:description" content="{esc(desc)}">')
              if has_meta(text, 'property', 'og:url'):
                  text = replace_meta(text, 'property', 'og:url', canonical)
              else:
                  text = add_meta(text, f'<meta property="og:url" content="{canonical}">')
              if not has_meta(text, 'property', 'og:type'):
                  text = add_meta(text, '<meta property="og:type" content="website">')
              if not has_meta(text, 'property', 'og:image'):
                  text = add_meta(text, f'<meta property="og:image" content="{BASE}/images/og_share.png">')

              # Twitter summary metadata.
              if not has_meta(text, 'name', 'twitter:card'):
                  text = add_meta(text, '<meta name="twitter:card" content="summary_large_image">')
              if has_meta(text, 'name', 'twitter:title'):
                  text = replace_meta(text, 'name', 'twitter:title', title)
              else:
                  text = add_meta(text, f'<meta name="twitter:title" content="{esc(title)}">')
              if has_meta(text, 'name', 'twitter:description'):
                  text = replace_meta(text, 'name', 'twitter:description', desc)
              else:
                  text = add_meta(text, f'<meta name="twitter:description" content="{esc(desc)}">')
              if not has_meta(text, 'name', 'twitter:image'):
                  text = add_meta(text, f'<meta name="twitter:image" content="{BASE}/images/og_share.png">')

              p.write_text(text, encoding='utf-8')

          # Validation: every HTML page must have the complete core set.
          required = [
              r'<title[^>]*>.+?</title>',
              r'<meta\s+[^>]*name=["\']description["\'][^>]*content=["\'].+?["\']',
              r'<meta\s+[^>]*name=["\']robots["\'][^>]*content=["\']index, follow["\']',
              r'<link\s+[^>]*rel=["\']canonical["\'][^>]*href=',
              r'<meta\s+[^>]*property=["\']og:title["\'][^>]*content=',
              r'<meta\s+[^>]*property=["\']og:description["\'][^>]*content=',
              r'<meta\s+[^>]*property=["\']og:url["\'][^>]*content=',
              r'<meta\s+[^>]*name=["\']twitter:title["\'][^>]*content=',
              r'<meta\s+[^>]*name=["\']twitter:description["\'][^>]*content=',
          ]
          bad=[]
          for p in files:
              t=p.read_text(encoding='utf-8')
              if any(not re.search(x,t,re.I|re.S) for x in required): bad.append(p.name)
          if bad:
              raise SystemExit('Metadata validation failed: '+', '.join(bad))
          print(f'Validated {len(files)} HTML pages.')
          PY

      - name: Commit metadata changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          git diff --cached --quiet && echo 'No metadata changes.' || git commit -m 'Complete SEO metadata across HTML pages'
          git push

      - name: Remove one-time workflow and trigger
        run: |
          git rm -f .github/workflows/seo-meta-second-pass.yml .seo-meta-second-pass-trigger 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'Remove one-time SEO metadata workflow'
          git push
