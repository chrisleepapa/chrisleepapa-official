name: Attach SISTER SQUAD 2 story enhancement
on:
  push:
    branches: [main]
    paths:
      - 'js/sistersquad2-story.js'
      - '.github/workflows/attach-ss2-story.yml'
permissions:
  contents: write
jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attach story script and remove one-time workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sistersquad2.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/js/sistersquad2-story.js?v=20260827" defer></script>'
          if tag not in s:
              marker='    <!-- ★ 공통 푸터 -->'
              if marker not in s:
                  raise SystemExit('footer marker not found')
              s=s.replace(marker, '    '+tag+'\n\n'+marker, 1)
              p.write_text(s,encoding='utf-8')
          wf=Path('.github/workflows/attach-ss2-story.yml')
          wf.unlink(missing_ok=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sistersquad2.html .github/workflows/attach-ss2-story.yml
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'Attach SISTER SQUAD 2 story enhancement'
          git push origin main
