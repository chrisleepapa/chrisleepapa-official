name: Fix gameinfo GOAL guide

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, '[auto-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Apply GOAL gameinfo fix
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) game-auth.js: retired Baduk card is removed, but guide #6 must remain.
          p = Path('js/game-auth.js')
          s = p.read_text(encoding='utf-8')
          old = '''    if (page === 'gameinfo') {
        const removeBaduk = () => {
            document.querySelectorAll('a.game-card[href*="baduk_easy"]').forEach(card => card.remove());
            document.querySelectorAll('[data-i18n="guide6_heading"]').forEach(heading => {
                const block = heading.closest('div[style*="border-bottom"], div[style*="padding-bottom"]');
                if (block) block.remove();
            });
            document.querySelectorAll('meta[name="description"], meta[property="og:description"]').forEach(meta => {
                if (meta.content) meta.content = meta.content.replace(/,?\\s*바둑 EASY/g,'').replace(/·바둑EASY/g,'').replace(/7가지/g,'6가지');
            });
            const intro = document.querySelector('[data-i18n="game_intro_desc"]');
            if (intro) intro.innerHTML = intro.innerHTML.replace(/<strong style="color:#e8d08a;">7가지 무료 온라인 미니게임<\\/strong>/g,'<strong style="color:#e8d08a;">6가지 무료 온라인 미니게임<\\/strong>');
        };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', removeBaduk, {once:true}); else removeBaduk();
        return;
    }'''
          new = '''    if (page === 'gameinfo') {
        const removeBaduk = () => {
            document.querySelectorAll('a.game-card[href*="baduk_easy"]').forEach(card => card.remove());
        };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', removeBaduk, {once:true}); else removeBaduk();
        return;
    }'''
          if old not in s:
              raise SystemExit('game-auth.js target block not found; no changes made')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 2) gameinfo.html: make Fairy Popo #6 and add GOAL #7 using the same card/guide format.
          p = Path('gameinfo.html')
          s = p.read_text(encoding='utf-8')

          # Card: clone the existing Fairy Popo image-mode card so layout/hover behavior stays identical.
          m = re.search(r'(<a href="(?:/)?switch\.html" class="game-card game-card-image-mode">.*?</a>)', s, re.S)
          if not m:
              raise SystemExit('Fairy Popo game card not found')
          popo_card = m.group(1)
          goal_card = popo_card
          goal_card = goal_card.replace('href="switch.html"', 'href="/goal.html"', 1).replace('href="/switch.html"', 'href="/goal.html"', 1)
          goal_card = goal_card.replace('class="bg-switch"', 'class="bg-goal"', 1)
          goal_card = re.sub(r'<img\s+src="[^"]*"\s+alt="[^"]*"', '<img src="/images/goal.png" alt="골이예요 GOAL"', goal_card, count=1)
          goal_card = goal_card.replace('class="game-tag tag-switch"', 'class="game-tag tag-switch"', 1)
          goal_card = re.sub(r'<div class="game-tag tag-switch">.*?</div>', '<div class="game-tag tag-switch">MIRACLE SHOT GAME</div>', goal_card, count=1, flags=re.S)
          goal_card = re.sub(r'<h3 class="game-card-title"[^>]*>.*?</h3>', '<h3 class="game-card-title">골이예요 GOAL</h3>', goal_card, count=1, flags=re.S)
          goal_card = re.sub(r'<p class="game-card-desc"[^>]*>.*?</p>', '<p class="game-card-desc">MIRACLE SHOT의 네 주인공 중 한 명을 선택해 거대한 점수벽을 향해 슛을 날리고, 맞힌 점수를 누적해 승부를 겨루는 1:1 축구 게임입니다.</p>', goal_card, count=1, flags=re.S)
          if 'goal-game-card' not in goal_card:
              goal_card = goal_card.replace('class="game-card game-card-image-mode"', 'class="game-card game-card-image-mode goal-game-card"', 1)
          if '/goal.html' not in s:
              s = s[:m.end()] + '\n\n            <!-- Game 7 -->\n' + goal_card + s[m.end():]

          # Guide: change Popo from #7 to #6, then clone the same guide block as #7 for GOAL.
          s = s.replace('data-i18n="guide7_heading">⑦ 요정 포포의 여정', 'data-i18n="guide6_heading">⑥ 요정 포포의 여정', 1)
          s = s.replace('data-i18n="guide7_desc">', 'data-i18n="guide6_desc">', 1)
          s = s.replace('guide7_heading: \'⑦ 요정 포포의 여정 — Action / Elemental\'', 'guide6_heading: \'⑥ 요정 포포의 여정 — Action / Elemental\'', 1)
          s = s.replace('guide7_desc: `귀여운 요정 포포가', 'guide6_desc: `귀여운 요정 포포가', 1)

          # Find the Popo guide container by its heading and duplicate that whole simple guide block.
          gm = re.search(r'(<div[^>]*>\s*<h3[^>]*data-i18n="guide6_heading"[\s\S]*?</div>)', s)
          if not gm:
              raise SystemExit('Fairy Popo guide block not found')
          popo_guide = gm.group(1)
          goal_guide = popo_guide
          goal_guide = goal_guide.replace('data-i18n="guide6_heading"', 'data-goal-game-guide="true"', 1)
          goal_guide = goal_guide.replace('⑥ 요정 포포의 여정 — Action / Elemental', '⑦ 골이예요 — MIRACLE SHOT GAME', 1)
          goal_guide = goal_guide.replace('data-i18n="guide6_desc"', 'data-goal-game-desc="true"', 1)
          goal_guide = re.sub(r'귀여운 요정 포포가.*?기회는 세번!', 'MIRACLE SHOT의 네 주인공 중 한 명을 선택해 거대한 점수벽을 향해 슛을 날리고, 맞힌 점수를 누적해 승부를 겨루는 1:1 축구 게임입니다.', goal_guide, count=1, flags=re.S)
          if '⑦ 골이예요 — MIRACLE SHOT GAME' not in s:
              s = s[:gm.end()] + '\n' + goal_guide + s[gm.end():]

          # Ensure the game intro/metadata remains 7 games.
          s = s.replace('6가지 무료 온라인 미니게임', '7가지 무료 온라인 미니게임')
          s = s.replace('7가지 무료 온라인 미니게임', '7가지 무료 온라인 미니게임')
          p.write_text(s, encoding='utf-8')

          # 3) Responsive guide-number CSS must match the final seven-game order.
          p = Path('css/game-responsive.css')
          s = p.read_text(encoding='utf-8')
          s = s.replace('content:"⑥ 바둑 EASY"', 'content:"⑥ 요정 포포의 여정"')
          s = s.replace('content:"⑦ 요정 포포의 여정"', 'content:"⑦ 골이예요"')
          p.write_text(s, encoding='utf-8')

      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gameinfo.html js/game-auth.js css/game-responsive.css
          git rm .github/workflows/fix-gameinfo-goal.yml
          git diff --cached --quiet && exit 0
          git commit -m "[auto-fix] Fix GOAL guide numbering and card"
          git push origin HEAD:develop
