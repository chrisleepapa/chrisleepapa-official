name: Patch game authentication

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Insert shared game auth without changing existing game code
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              'gameinfo.html',
              'game.html',
              'booktop.html',
              'fiveinrow.html',
              'curling.html',
              'tetris.html',
              'switch.html',
              'miracleshot.html',
          ]

          tag = '<script src="/js/game-auth.js"></script>'

          for name in files:
              p = Path(name)
              if not p.exists():
                  print(f'SKIP missing: {name}')
                  continue

              text = p.read_text(encoding='utf-8')
              if '/js/game-auth.js' in text:
                  print(f'OK already present: {name}')
                  continue

              marker = '</head>'
              pos = text.lower().find(marker)
              if pos < 0:
                  raise SystemExit(f'No </head> found: {name}')

              text = text[:pos] + '    ' + tag + '\n' + text[pos:]
              p.write_text(text, encoding='utf-8')
              print(f'PATCHED: {name}')
          PY

      - name: Commit game auth changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gameinfo.html game.html booktop.html fiveinrow.html curling.html tetris.html switch.html miracleshot.html
          if git diff --cached --quiet; then
            echo "No game files needed changes."
          else
            git commit -m "fix: connect game pages to shared account auth"
            git push
          fi
          git rm .github/workflows/patch-game-auth.yml
          git commit -m "chore: remove temporary game auth patch workflow"
          git push
