<!--
  components/footer.html
  ======================
  공유 푸터 컴포넌트입니다.
  js/main.js 의 loadComponents() 가 fetch 로 읽어 #site-footer 에 주입합니다.
-->

<style>
/* =========================================================
   GLOBAL FOOTER — Chris LEE.PAPA Official Site
   모든 페이지 / PC + Mobile 공통
   ========================================================= */
#site-footer{position:relative;z-index:20;width:100%;margin-top:auto}
#site-footer footer{width:100%;margin:0;padding:44px 24px 40px;text-align:center;background:linear-gradient(180deg,rgba(3,3,5,0) 0%,rgba(3,3,5,.72) 34%,rgba(3,3,5,.96) 100%);border-top:1px solid rgba(201,168,76,.12);font-family:'Noto Sans KR','Pretendard',sans-serif;color:rgba(224,224,224,.42);line-height:1.7;letter-spacing:.02em;-webkit-font-smoothing:antialiased}
#site-footer footer p{margin:0}
#site-footer footer p:first-child{font-family:'Cormorant Garamond','Noto Sans KR',serif;font-size:.82rem;letter-spacing:.08em;color:rgba(224,224,224,.48)}
#site-footer .footer-policy{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:12px;font-family:'Noto Sans KR','Pretendard',sans-serif;font-size:.67rem;line-height:1.6;letter-spacing:.04em}
#site-footer .footer-policy a{color:rgba(232,208,138,.58);transition:color .25s ease,text-shadow .25s ease}
#site-footer .footer-policy a:hover,#site-footer .footer-policy a:focus-visible{color:#e8d08a;text-shadow:0 0 12px rgba(201,168,76,.2)}
#site-footer .footer-divider{color:rgba(201,168,76,.28);font-size:.6rem}
#site-footer .movie-creation-cta{max-width:960px;margin:0 auto 38px;padding:28px 30px;text-align:center;border:1px solid rgba(201,168,76,.2);border-radius:18px;background:linear-gradient(135deg,rgba(201,168,76,.07),rgba(255,255,255,.015));box-shadow:0 12px 35px rgba(0,0,0,.28)}
#site-footer .movie-creation-cta p{margin:0 0 16px;color:#a0a0b5;font-size:.82rem;line-height:1.8;word-break:keep-all}
#site-footer .movie-creation-cta strong{display:block;margin-bottom:5px;color:#e8d08a;font-family:'Cinzel',serif;font-size:.9rem;letter-spacing:.12em}
#site-footer .movie-creation-cta a{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 20px;border:1px solid rgba(232,208,138,.42);border-radius:10px;color:#e8d08a;font-family:'Noto Sans KR','Pretendard',sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-decoration:none;transition:all .25s ease}
#site-footer .movie-creation-cta a:hover,#site-footer .movie-creation-cta a:focus-visible{border-color:#e8d08a;background:rgba(201,168,76,.1);color:#fff;transform:translateY(-1px)}

/* =========================================================
   MOVIE CREATION NOTES — editorial card treatment
   카드 모음처럼 보이지 않고 하나의 창작 기록으로 읽히도록 구성
   ========================================================= */
.creation-notes .creation-note-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid rgba(201,168,76,.14);border-bottom:1px solid rgba(255,255,255,.06)}
.creation-notes .creation-note{position:relative;padding:26px 24px 28px;border:0;border-radius:0;background:transparent;border-right:1px solid rgba(255,255,255,.07)}
.creation-notes .creation-note:last-child{border-right:0}
.creation-notes .creation-note::before{content:'';display:block;width:28px;height:2px;margin-bottom:18px;background:rgba(201,168,76,.65)}
.creation-notes .creation-note h4{font-size:.9rem;line-height:1.5;letter-spacing:.04em;margin-bottom:12px;color:#e8d08a}
.creation-notes .creation-note p{font-size:.94rem;line-height:1.95;color:#b7b2aa}
.creation-notes .creation-prompt{margin-top:20px;padding:25px 0 0;border-top:1px solid rgba(255,255,255,.06)}
.creation-notes .creation-prompt h4{font-size:.9rem;color:#e8d08a}
.creation-notes .creation-prompt pre{margin-top:14px;padding:20px 22px;border-radius:12px;background:rgba(0,0,0,.32);border:1px solid rgba(201,168,76,.16);box-shadow:inset 0 0 30px rgba(0,0,0,.18);font-size:.8rem;line-height:1.8;color:#d8d3c8}
@media(max-width:900px){
  .creation-notes .creation-note-grid{grid-template-columns:1fr}
  .creation-notes .creation-note{border-right:0;border-bottom:1px solid rgba(255,255,255,.07);padding:23px 0}
  .creation-notes .creation-note:last-child{border-bottom:0}
}
@media(max-width:760px){
  #site-footer footer{padding:30px 18px calc(28px + env(safe-area-inset-bottom));border-top-color:rgba(201,168,76,.14)}
  #site-footer footer p:first-child{font-size:.7rem;letter-spacing:.045em;line-height:1.6}
  #site-footer .footer-policy{margin-top:9px;gap:10px;font-size:.62rem;line-height:1.6}
  #site-footer .movie-creation-cta{margin:0 18px 28px;padding:24px 18px}
  #site-footer .movie-creation-cta p{font-size:.74rem}
  #site-footer .movie-creation-cta a{font-size:.64rem;padding:10px 16px}
  .creation-notes .creation-note{padding:22px 0}
  .creation-notes .creation-note p{font-size:.9rem;line-height:1.9}
  .creation-notes .creation-prompt pre{padding:16px;font-size:.74rem;line-height:1.75}
}
</style>

<footer>
    <div class="movie-creation-cta" id="movieCreationCta" style="display:none">
        <strong>✦ MOVIE CREATION NOTES</strong>
        <p>영상의 아이디어부터 생성형 AI 활용, 제작 과정과 프롬프트까지 자세한 창작 기록을 확인해보세요.</p>
        <a href="/movie-creation" aria-label="Movie Creation Notes — 영상 제작 과정과 제작 프롬프트">제작 과정 &amp; 프롬프트 보기 →</a>
    </div>
    <p data-i18n="footer_text">© 2026 Chris LEE.PAPA — The Creative Archive</p>
    <p class="footer-policy">
        <a href="/privacy" data-i18n="footer_privacy">개인정보처리방침</a>
        <span class="footer-divider">·</span>
        <a href="/terms" data-i18n="footer_terms">이용약관</a>
    </p>
</footer>

<script>
(function(){
  var isMovie = /^\/movie\/?$/i.test(window.location.pathname);
  var cta = document.getElementById('movieCreationCta');
  if(cta && isMovie) cta.style.display='block';
})();
</script>
