name: Fix About timeline body

on:
  push:
    branches: [develop]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 1
      - name: Update visible September timeline text
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('about.html')
          s = p.read_text(encoding='utf-8')
          old = '지금까지의 창작물을 다시 정리하고 The Creative Archive를 전면 재개편했습니다.'
          new = 'Creative Archive를 전면 업데이트하고, SISTER SQUAD 1 영문판 제작 및 유통을 준비하고 있습니다. J-POP 음악 제작과 론칭도 준비하고 있습니다.'
          if old not in s:
              raise SystemExit('visible Korean timeline text not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html
          git rm .github/workflows/fix-about-timeline-body.yml
          git commit -m "Update visible September timeline entry"
          git push origin develop
